name: Build v0.14.4 SequenceAttachFix from Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0144-sequencefix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_ARTIFACT_ID: '10039113175'
      OUT_NAME: NIKKE_Mod_Manager_v0_14_4_Classic_Integrated_Viewer_SEQUENCE_ATTACHFIX_FULL
    steps:
      - name: Download v0.14.3 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o artifact.zip
          file artifact.zip
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          echo "Artifact content:"
          find artifact -maxdepth 3 -type f -print
          appzip="$(find artifact -type f -name '*.zip' | head -n 1 || true)"
          if [ -n "$appzip" ]; then
            unzip -q "$appzip" -d extracted
          else
            cp -a artifact/. extracted/
          fi
          find extracted -maxdepth 4 -type f -path '*/src/preview.py' -print
          find extracted -maxdepth 4 -type f -path '*/web/app.js' -print

      - name: Patch app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          roots = [p.parent.parent for p in Path('extracted').rglob('src/preview.py')]
          if not roots:
              raise SystemExit('No se encontro src/preview.py')

          JS_PATCH = textwrap.dedent(r'''
          
          // --- NMM v0.14.4 Spine sequence + nullable attachment patch ----------------
          (function () {
            if (window.__NMM_V0144_SEQUENCE_ATTACH_PATCH__) return;
            window.__NMM_V0144_SEQUENCE_ATTACH_PATCH__ = true;

            function variants(name) {
              var s = String(name == null ? '' : name);
              var out = [];
              function add(v) { if (v && v !== s && out.indexOf(v) < 0) out.push(v); }
              add(s.replace(/\d+$/, ''));
              add(s.replace(/[_-]?\d+$/, ''));
              add(s.replace(/t\d+$/, 't'));
              add(s.replace(/([a-z_]+)[0-9]+$/i, '$1'));
              return out;
            }

            function safeName(name, path, prefix) {
              var n = (name == null || name === '') ? (path || '') : name;
              if (n == null || n === '') n = (prefix || 'attachment') + '_unnamed';
              return String(n);
            }

            function scanRegions(atlas, wanted) {
              var list = variants(wanted);
              var regs = atlas && atlas.regions;
              if (!regs || !regs.length) return null;
              for (var n = 0; n < list.length; n++) {
                for (var i = 0; i < regs.length; i++) {
                  var r = regs[i];
                  if (r && r.name === list[n]) return r;
                }
              }
              return null;
            }

            function patchTextureAtlasClass(Ctor) {
              if (!Ctor || !Ctor.prototype) return false;
              var proto = Ctor.prototype;
              if (proto.__nmm_v0144_findRegion_patched) return true;
              var original = proto.findRegion;
              if (typeof original !== 'function') return false;
              proto.findRegion = function (name) {
                var r = original.call(this, name);
                if (r) return r;
                var vs = variants(name);
                for (var i = 0; i < vs.length; i++) {
                  try { r = original.call(this, vs[i]); if (r) return r; } catch (e) {}
                }
                r = scanRegions(this, name);
                return r || null;
              };
              proto.__nmm_v0144_findRegion_patched = true;
              return true;
            }

            function patchAttachmentCtor(ns, key, fallback) {
              if (!ns || !ns[key] || ns[key].__nmm_v0144_safe_ctor) return false;
              var Original = ns[key];
              try {
                var Safe = function(name) {
                  var finalName = safeName(name, null, fallback);
                  return Reflect.construct(Original, [finalName], Safe);
                };
                Object.setPrototypeOf(Safe, Original);
                Safe.prototype = Original.prototype;
                Safe.__nmm_v0144_safe_ctor = true;
                ns[key] = Safe;
                return true;
              } catch (e) {
                return false;
              }
            }

            function patchLoaderClass(Ctor) {
              if (!Ctor || !Ctor.prototype) return false;
              var proto = Ctor.prototype;
              if (proto.__nmm_v0144_loader_patched) return true;

              function wrapRegionLike(method, prefix) {
                var original = proto[method];
                if (typeof original !== 'function') return;
                proto[method] = function (skin, name, path) {
                  var args = Array.prototype.slice.call(arguments);
                  var fixedPath = (path == null || path === '') ? (name || '') : path;
                  var fixedName = safeName(name, fixedPath, prefix);
                  args[1] = fixedName;
                  args[2] = fixedPath || fixedName;
                  try {
                    return original.apply(this, args);
                  } catch (err) {
                    var msg = String((err && err.message) || err || '');
                    if (!/Region not found|Attachment name must not be null/i.test(msg)) throw err;
                    var vs = variants(args[2]);
                    for (var i = 0; i < vs.length; i++) {
                      var retryArgs = args.slice();
                      retryArgs[1] = safeName(fixedName, vs[i], prefix);
                      retryArgs[2] = vs[i];
                      try { return original.apply(this, retryArgs); } catch (e) {}
                    }
                    throw err;
                  }
                };
              }

              function wrapNameOnly(method, prefix) {
                var original = proto[method];
                if (typeof original !== 'function') return;
                proto[method] = function (skin, name) {
                  var args = Array.prototype.slice.call(arguments);
                  args[1] = safeName(name, null, prefix);
                  return original.apply(this, args);
                };
              }

              wrapRegionLike('newRegionAttachment', 'region');
              wrapRegionLike('newMeshAttachment', 'mesh');
              wrapNameOnly('newBoundingBoxAttachment', 'bbox');
              wrapNameOnly('newPathAttachment', 'path');
              wrapNameOnly('newPointAttachment', 'point');
              wrapNameOnly('newClippingAttachment', 'clip');
              proto.__nmm_v0144_loader_patched = true;
              return true;
            }

            function collectNamespaces() {
              var out = [];
              function add(x) { if (x && out.indexOf(x) < 0) out.push(x); }
              add(window.spine); add(window.spine && window.spine.core);
              add(window.spine38); add(window.spine41);
              add(window.pixi_spine); add(window.pixi_spine && window.pixi_spine.core);
              add(window.pixi_spine && window.pixi_spine.base);
              add(window.pixi_spine && window.pixi_spine.spine38);
              add(window.pixi_spine && window.pixi_spine.spine41);
              add(window.PIXI && window.PIXI.spine);
              add(window.PIXI && window.PIXI.spine && window.PIXI.spine.core);
              add(window.PIXI && window.PIXI.spine && window.PIXI.spine.base);
              add(window.PIXI && window.PIXI.spine && window.PIXI.spine.spine38);
              add(window.PIXI && window.PIXI.spine && window.PIXI.spine.spine41);
              return out;
            }

            window.__nmmPatchSpineAtlasSequences = function () {
              var ok = false;
              var ns = collectNamespaces();
              for (var i = 0; i < ns.length; i++) {
                try {
                  ok = patchTextureAtlasClass(ns[i].TextureAtlas) || ok;
                  ok = patchLoaderClass(ns[i].AtlasAttachmentLoader) || ok;
                  ok = patchAttachmentCtor(ns[i], 'RegionAttachment', 'region') || ok;
                  ok = patchAttachmentCtor(ns[i], 'MeshAttachment', 'mesh') || ok;
                  ok = patchAttachmentCtor(ns[i], 'BoundingBoxAttachment', 'bbox') || ok;
                  ok = patchAttachmentCtor(ns[i], 'PathAttachment', 'path') || ok;
                  ok = patchAttachmentCtor(ns[i], 'PointAttachment', 'point') || ok;
                  ok = patchAttachmentCtor(ns[i], 'ClippingAttachment', 'clip') || ok;
                } catch (e) {}
              }
              return ok;
            };

            var tries = 0;
            var timer = setInterval(function () {
              tries++;
              if (window.__nmmPatchSpineAtlasSequences() || tries > 600) clearInterval(timer);
            }, 20);
          })();
          // --- end NMM v0.14.4 --------------------------------------------------------
          ''')

          for root in roots:
              preview = root / 'src' / 'preview.py'
              appjs = root / 'web' / 'app.js'

              ps = preview.read_text(encoding='utf-8', errors='ignore')
              preview.with_suffix('.py.bak_v0144_sequenceattach').write_text(ps, encoding='utf-8')
              if 'from PIL import Image' not in ps and 'import PIL.Image' not in ps:
                  marker = 'from __future__ import annotations\n'
                  ps = ps.replace(marker, marker + 'from PIL import Image\n', 1) if marker in ps else 'from PIL import Image\n' + ps
              ps = ps.replace('from PIL import Image as PILImage', 'from PIL import Image')
              ps = ps.replace('img.__class__.new(', 'Image.new(')
              ps = ps.replace('image.__class__.new(', 'Image.new(')
              ps = ps.replace('PILImage.new(', 'Image.new(')
              ps = ps.replace('Classic v0.14 Integrated Viewer', 'Classic v0.14.4 SequenceAttachFix')
              ps = ps.replace('Classic v0.14.3 AtlasPreserveFix', 'Classic v0.14.4 SequenceAttachFix')
              compile(ps, str(preview), 'exec')
              preview.write_text(ps, encoding='utf-8')

              js = appjs.read_text(encoding='utf-8', errors='ignore')
              appjs.with_suffix('.js.bak_v0144_sequenceattach').write_text(js, encoding='utf-8')
              if 'NMM v0.14.4 Spine sequence + nullable attachment patch' not in js:
                  lines = js.splitlines()
                  out = []
                  for line in lines:
                      trigger = (('new ' in line or '.readSkeletonData' in line) and any(k in line for k in ['TextureAtlas','AtlasAttachmentLoader','SkeletonBinary','SkeletonJson','readSkeletonData']) and '__nmmPatchSpineAtlasSequences' not in line)
                      if trigger:
                          indent = re.match(r'\s*', line).group(0)
                          out.append(indent + 'try { window.__nmmPatchSpineAtlasSequences && window.__nmmPatchSpineAtlasSequences(); } catch(e) {}')
                      out.append(line)
                  js = '\n'.join(out) + '\n' + JS_PATCH + '\n'
              js = js.replace('Classic v0.14 Integrated Viewer', 'Classic v0.14.4 SequenceAttachFix')
              js = js.replace('Classic v0.14.3 AtlasPreserveFix', 'Classic v0.14.4 SequenceAttachFix')
              js = js.replace('Debug R8', 'Debug v0.14.4')
              js = js.replace('DEBUG R8', 'DEBUG v0.14.4')
              appjs.write_text(js, encoding='utf-8')

              for rel in ['VERSION.txt', 'LEEME_PRIMERO.txt']:
                  p = root / rel
                  old = p.read_text(encoding='utf-8', errors='ignore') if p.exists() else ''
                  p.write_text('NIKKE Mod Manager v0.14.4 Classic Integrated Viewer SequenceAttachFix FULL\n\nCorrige Attachment name must not be null, alias de secuencias body_t0000 -> body_t, y mantiene fixes de atlas/padding.\nInstalacion: descomprimir en carpeta nueva y ejecutar INSTALAR_Y_ABRIR.bat.\n\n' + old, encoding='utf-8')
              print('patched', root)
          PY

      - name: Rename and zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          root = Path('extracted')
          dirs = [p for p in root.iterdir() if p.is_dir()]
          if len(dirs) != 1:
              raise SystemExit(f'Esperaba 1 carpeta, encontre {dirs}')
          app = dirs[0]
          target = root / 'NIKKE_Mod_Manager_v0_14_4_Classic_Integrated_Viewer_SEQUENCE_ATTACHFIX_FULL'
          if app != target:
              if target.exists(): shutil.rmtree(target)
              app.rename(target)
          preview = target / 'src' / 'preview.py'
          appjs = target / 'web' / 'app.js'
          pt = preview.read_text(encoding='utf-8', errors='ignore')
          jt = appjs.read_text(encoding='utf-8', errors='ignore')
          assert 'Image.new(' in pt, 'Image.new fix missing'
          assert 'nullable attachment patch' in jt, 'JS attachment patch missing'
          assert 'patchAttachmentCtor' in jt, 'constructor patch missing'
          compile(pt, str(preview), 'exec')
          out = Path('dist'); out.mkdir(exist_ok=True)
          zip_path = out / 'NIKKE_Mod_Manager_v0_14_4_Classic_Integrated_Viewer_SEQUENCE_ATTACHFIX_FULL.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in target.rglob('*'):
                  if p.is_file(): z.write(p, p.relative_to(target.parent))
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad: raise RuntimeError(f'zip corrupto: {bad}')
          print(zip_path, zip_path.stat().st_size)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_14_4_Classic_Integrated_Viewer_SEQUENCE_ATTACHFIX_FULL
          path: dist/NIKKE_Mod_Manager_v0_14_4_Classic_Integrated_Viewer_SEQUENCE_ATTACHFIX_FULL.zip
          if-no-files-found: error
          retention-days: 90
