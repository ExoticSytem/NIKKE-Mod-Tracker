name: Build PC Preview v0.13 RESTORED NATIVE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pc_full_v013_restored/**'
      - 'pc_full_v012/manager.py'
      - 'pc_preview_v012/preview_beta_server.py'
      - 'catalog/base_catalog.json'
      - '.github/workflows/build-pc-preview-v013-restored.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow cryptography send2trash

      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile pc_full_v012/manager.py
          python -m py_compile pc_full_v013_restored/native_preview.py
          python -m py_compile pc_full_v013_restored/manager_native.py
          python -m py_compile pc_preview_v012/preview_beta_server.py

      - name: Prepare restored native desktop package
        shell: pwsh
        run: |
          $root = 'output/NIKKE_Mod_Manager_v0_13_Restored_Native_Preview'
          New-Item -ItemType Directory -Force "$root/tools" | Out-Null
          New-Item -ItemType Directory -Force "$root/catalog" | Out-Null
          New-Item -ItemType Directory -Force "$root/data" | Out-Null
          Copy-Item pc_full_v012/manager.py "$root/manager.py"
          Copy-Item pc_full_v013_restored/manager_native.py "$root/manager_native.py"
          Copy-Item pc_full_v013_restored/native_preview.py "$root/native_preview.py"
          Copy-Item pc_full_v013_restored/INSTALAR_Y_ABRIR.bat "$root/INSTALAR_Y_ABRIR.bat"
          Copy-Item pc_full_v013_restored/README.txt "$root/README.txt"
          Copy-Item pc_preview_v012/preview_beta_server.py "$root/tools/preview_beta_server.py"
          Copy-Item catalog/base_catalog.json "$root/catalog/base_catalog.json"
          'NIKKE Mod Manager v0.13 - Restored Native Preview' | Set-Content -Encoding UTF8 "$root/VERSION.txt"

      - name: Validate package modules
        shell: pwsh
        run: |
          @'
          import importlib.util, json, pathlib
          root = pathlib.Path('output/NIKKE_Mod_Manager_v0_13_Restored_Native_Preview')
          catalog = json.loads((root/'catalog'/'base_catalog.json').read_text(encoding='utf-8'))
          chars = catalog.get('characters', [])
          assert len(chars) >= 500, f'Catalog too small: {len(chars)}'
          for name in ('manager.py','native_preview.py','manager_native.py'):
              p = root/name
              assert p.exists(), p
          assert (root/'tools'/'preview_beta_server.py').exists()
          print('Restored native package layout OK')
          '@ | Set-Content -Encoding UTF8 test_package.py
          python test_package.py

      - name: Verify no browser preview launcher is used
        shell: pwsh
        run: |
          $native = Get-Content pc_full_v013_restored/native_preview.py -Raw
          $launcher = Get-Content pc_full_v013_restored/manager_native.py -Raw
          if ($native -match 'webbrowser\.open') { throw 'Native preview must not open a browser' }
          if ($launcher -match 'webbrowser\.open') { throw 'Native launcher must not open a browser' }
          if ($native -notmatch 'NativePreviewWindow') { throw 'NativePreviewWindow missing' }
          Write-Host 'Native preview check OK'

      - name: Test preview engine import
        shell: pwsh
        run: |
          @'
          import importlib.util, pathlib, tempfile
          p = pathlib.Path('pc_preview_v012/preview_beta_server.py')
          spec = importlib.util.spec_from_file_location('pb', p)
          pb = importlib.util.module_from_spec(spec); spec.loader.exec_module(pb)
          with tempfile.TemporaryDirectory() as d:
              root = pathlib.Path(d) / 'c043_02_cover_Test-3DMigoto'
              root.mkdir()
              (root/'mod.ini').write_text('[TextureOverrideBody]\nhash=123\nvb0 = ResourceBody\n', encoding='utf-8')
              assert pb.is_3dmigoto(root)
          print('Preview engine helper OK')
          '@ | Set-Content -Encoding UTF8 test_engine.py
          python test_engine.py

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'output/NIKKE_Mod_Manager_v0_13_Restored_Native_Preview' -DestinationPath 'output/NIKKE_Mod_Manager_v0_13_Restored_Native_Preview.zip' -Force

      - name: Upload restored native package
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Mod-Manager-v0.13-RESTORED-NATIVE
          path: output/NIKKE_Mod_Manager_v0_13_Restored_Native_Preview.zip
          if-no-files-found: error
          retention-days: 30
