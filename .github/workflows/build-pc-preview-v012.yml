name: Build PC Preview v0.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pc_preview_v012/**'
      - '.github/workflows/build-pc-preview-v012.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow cryptography

      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile pc_preview_v012/preview_beta_server.py
          python -m py_compile pc_preview_v012/update_to_v012.py

      - name: Smoke test server
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'pc_preview_v012/preview_beta_server.py','--root','pc_preview_v012','--port','8137' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8137/health
          if ($r.StatusCode -ne 200) { throw 'Preview health check failed' }
          Stop-Process -Id $p.Id -Force

      - name: Test 3DMigoto detection helpers
        shell: pwsh
        run: |
          @'
          import importlib.util, pathlib, tempfile
          p = pathlib.Path('pc_preview_v012/preview_beta_server.py')
          spec = importlib.util.spec_from_file_location('pb', p)
          pb = importlib.util.module_from_spec(spec); spec.loader.exec_module(pb)
          with tempfile.TemporaryDirectory() as d:
              root = pathlib.Path(d) / 'c043_02_cover_Test-3DMigoto'
              root.mkdir()
              (root / 'mod.ini').write_text('[TextureOverrideBody]\nhash=123\nvb0 = ResourceBody\n', encoding='utf-8')
              assert pb.is_3dmigoto(root)
              info = pb.parse_mod_name(root)
              assert info['id'] == '043' and info['ver'] == '02' and info['action'].lower() == 'cover'
          print('3DMigoto helper test OK')
          '@ | Set-Content -Encoding UTF8 test_preview.py
          python test_preview.py

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item pc_preview_v012/ACTUALIZAR_A_V0_12.bat output/
          Copy-Item pc_preview_v012/update_to_v012.py output/
          Copy-Item pc_preview_v012/preview_beta_server.py output/
          Copy-Item pc_preview_v012/README.txt output/
          @'
          NIKKE Mod Manager v0.12 Preview Beta
          Build validado por GitHub Actions.
          Ejecuta ACTUALIZAR_A_V0_12.bat sobre tu v0.11.
          '@ | Set-Content -Encoding UTF8 output/LEEME_PRIMERO.txt

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Mod-Manager-v0.12-Preview-Beta-UPDATE
          path: output/*
          if-no-files-found: error
          retention-days: 30
