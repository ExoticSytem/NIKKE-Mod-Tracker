name: Inspect legacy PC v0.11 sources MAIN TEMP

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-legacy-pc-v011-main.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build inspection report
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/legacy_v011_report.txt"
          {
            echo '=== CANDIDATE PATHS IN ALL HISTORY ==='
            git log --all --name-only --pretty=format: | sort -u | grep -Ei 'INSTALAR_Y_ABRIR|Preview[_ -]?Alpha|Mod[_ -]?(Library|Manager)|pc_.*v0.?11|v0.?11|\.zip$|source\.zip' || true
            echo
            echo '=== COMMITS MENTIONING V0.11 / PREVIEW ALPHA / PC MANAGER ==='
            git log --all --oneline --decorate --regexp-ignore-case --grep='v0\.11|Preview Alpha|PC manager' || true
            echo
            echo '=== SOURCE.ZIP.B64 ==='
            if [ -f source.zip.b64 ]; then
              base64 -d source.zip.b64 > "$RUNNER_TEMP/source.zip" || true
              file "$RUNNER_TEMP/source.zip" || true
              unzip -l "$RUNNER_TEMP/source.zip" | sed -n '1,500p' || true
            else
              echo 'source.zip.b64 not found'
            fi
            echo
            echo '=== SPLIT SOURCE PARTS ==='
            ls -lh source.part* 2>/dev/null || true
            if ls source.part* >/dev/null 2>&1; then
              cat source.part* > "$RUNNER_TEMP/source_parts.bin" || true
              file "$RUNNER_TEMP/source_parts.bin" || true
              echo 'First 256 bytes:'
              head -c 256 "$RUNNER_TEMP/source_parts.bin" | xxd || true
            fi
            echo
            echo '=== CURRENT ROOT ==='
            find . -maxdepth 2 -type f -printf '%p\n' | sort | sed -n '1,500p'
          } > "$REPORT" 2>&1

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: legacy-pc-v011-inspection
          path: ${{ runner.temp }}/legacy_v011_report.txt
          if-no-files-found: error
          retention-days: 7
