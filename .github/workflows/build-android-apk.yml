name: Build v0.14.1 Claude PaddingFix ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  patch-v0141-paddingfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAR_URL: 'https://eu-central.storage.cloudconvert.com/tasks/ab145fcb-621e-486c-a917-338556dfcc7e/NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer.tar?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260908%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260908T015517Z&X-Amz-Expires=86400&X-Amz-Signature=218c44397098afc5baad5de0fed57eda763a18c9c7ba1e090c4ae413f3e0e888&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer.tar%22&response-content-type=application%2Fx-tar&x-amz-checksum-mode=ENABLED&x-id=GetObject'
      OUT_NAME: NIKKE_Mod_Manager_v0_14_1_Classic_Integrated_Viewer_PADDINGFIX_FULL
    steps:
      - name: Download source ZIP converted to TAR
        shell: bash
        run: |
          set -euo pipefail
          curl -L "$TAR_URL" -o source.tar
          mkdir extracted
          tar -xf source.tar -C extracted
          echo "Extracted preview.py files:"
          find extracted -path '*/src/preview.py' -print

      - name: Patch Pillow padding bug
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('extracted').rglob('src/preview.py'))
          if not files:
              raise SystemExit('No se encontro src/preview.py')
          for p in files:
              s = p.read_text(encoding='utf-8', errors='ignore')
              p.with_suffix('.py.bak_paddingfix').write_text(s, encoding='utf-8')
              if 'PILImage' not in s:
                  marker = 'from __future__ import annotations\n'
                  imp = 'from PIL import Image as PILImage\n'
                  if marker in s:
                      s = s.replace(marker, marker + imp, 1)
                  else:
                      s = imp + s
              s = s.replace('img.__class__.new(', 'PILImage.new(')
              s = s.replace('image.__class__.new(', 'PILImage.new(')
              # In this codebase Image may be shadowed by the PIL Image class, so force module alias.
              s = s.replace('Image.new(', 'PILImage.new(')
              s = s.replace('NIKKE Mod Manager v0.14 Classic Integrated Viewer', 'NIKKE Mod Manager v0.14.1 Classic Integrated Viewer PaddingFix')
              s = s.replace('Classic v0.14 Integrated Viewer', 'Classic v0.14.1 PaddingFix')
              p.write_text(s, encoding='utf-8')
              print('patched', p)
              compile(s, str(p), 'exec')
          PY

      - name: Rename and update notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('extracted')
          entries = [p for p in root.iterdir()]
          if len(entries) == 1 and entries[0].is_dir():
              app = entries[0]
          else:
              app = root / 'NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer'
          target = root / 'NIKKE_Mod_Manager_v0_14_1_Classic_Integrated_Viewer_PADDINGFIX_FULL'
          if app != target:
              app.rename(target)
          for rel in ['VERSION.txt', 'LEEME_PRIMERO.txt']:
              p = target / rel
              old = p.read_text(encoding='utf-8', errors='ignore') if p.exists() else ''
              p.write_text('NIKKE Mod Manager v0.14.1 Classic Integrated Viewer PaddingFix FULL\n\nCorrige el error de Pillow en _pad_image_to: type object Image has no attribute new.\nBase: v0.14 Classic Integrated Viewer generado por Claude.\nInstalacion: descomprimir y ejecutar INSTALAR_Y_ABRIR.bat.\n\n' + old, encoding='utf-8')
          print(target)
          PY

      - name: Validate and zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out = Path('dist')
          out.mkdir(exist_ok=True)
          root = Path('extracted') / 'NIKKE_Mod_Manager_v0_14_1_Classic_Integrated_Viewer_PADDINGFIX_FULL'
          assert (root / 'src' / 'preview.py').exists(), 'preview.py missing'
          assert (root / 'web' / 'app.js').exists(), 'web/app.js missing'
          zip_path = out / 'NIKKE_Mod_Manager_v0_14_1_Classic_Integrated_Viewer_PADDINGFIX_FULL.zip'
          if zip_path.exists():
              zip_path.unlink()
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'zip corrupto: {bad}')
          print(zip_path, zip_path.stat().st_size)
          PY

      - name: Upload patched ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_14_1_Classic_Integrated_Viewer_PADDINGFIX_FULL
          path: dist/NIKKE_Mod_Manager_v0_14_1_Classic_Integrated_Viewer_PADDINGFIX_FULL.zip
          if-no-files-found: error
          retention-days: 90
