name: Build v0.14.3 Atlas PreserveFix ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  patch-v0143-atlas-preservefix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAR_URL: 'https://eu-central.storage.cloudconvert.com/tasks/ab145fcb-621e-486c-a917-338556dfcc7e/NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer.tar?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260908%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260908T015517Z&X-Amz-Expires=86400&X-Amz-Signature=218c44397098afc5baad5de0fed57eda763a18c9c7ba1e090c4ae413f3e0e888&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer.tar%22&response-content-type=application%2Fx-tar&x-amz-checksum-mode=ENABLED&x-id=GetObject'
      OUT_NAME: NIKKE_Mod_Manager_v0_14_3_Classic_Integrated_Viewer_ATLASPRESERVE_FULL
    steps:
      - name: Download Claude source converted to TAR
        shell: bash
        run: |
          set -euo pipefail
          curl -L "$TAR_URL" -o source.tar
          mkdir extracted
          tar -xf source.tar -C extracted
          find extracted -maxdepth 4 -type f -path '*/src/preview.py' -print

      - name: Patch preview.py Atlas PreserveFix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          files = list(Path('extracted').rglob('src/preview.py'))
          if not files:
              raise SystemExit('No se encontro src/preview.py')

          append = textwrap.dedent(r'''
              
              # --- NMM v0.14.3 Atlas PreserveFix -----------------------------------------
              # Do not delete atlas regions by suspicious names: the .skel may still need them.
              # Preserve the original atlas and expand the transparent Spine canvas instead.
              try:
                  _nmm_v0143_original_sanitize_atlas = _sanitize_atlas
              except NameError:
                  _nmm_v0143_original_sanitize_atlas = None
              import re as _nmm_v0143_re
              
              def _nmm_v0143_needed_canvas(atlas_text, base_w=0, base_h=0, hard_limit=8192):
                  text = atlas_text or ''
                  bw = int(base_w or 0)
                  bh = int(base_h or 0)
                  m = _nmm_v0143_re.search(r'(?im)^\s*size\s*:\s*(-?\d+)\s*,\s*(-?\d+)\s*$', text)
                  if (bw <= 0 or bh <= 0) and m:
                      bw, bh = int(m.group(1)), int(m.group(2))
                  need_w, need_h = max(1, bw), max(1, bh)
                  for m in _nmm_v0143_re.finditer(r'(?im)^\s*bounds\s*:\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*$', text):
                      x, y, w, h = map(int, m.groups())
                      if w > 0 and h > 0:
                          need_w = max(need_w, x + w)
                          need_h = max(need_h, y + h)
                  last_xy = None
                  for line in text.splitlines():
                      mxy = _nmm_v0143_re.match(r'\s*xy\s*:\s*(-?\d+)\s*,\s*(-?\d+)\s*$', line)
                      if mxy:
                          last_xy = (int(mxy.group(1)), int(mxy.group(2)))
                          continue
                      ms = _nmm_v0143_re.match(r'\s*size\s*:\s*(-?\d+)\s*,\s*(-?\d+)\s*$', line)
                      if ms and last_xy:
                          x, y = last_xy
                          w, h = int(ms.group(1)), int(ms.group(2))
                          if w > 0 and h > 0:
                              need_w = max(need_w, x + w)
                              need_h = max(need_h, y + h)
                          last_xy = None
                  return max(1, min(int(need_w), hard_limit)), max(1, min(int(need_h), hard_limit))
              
              def _nmm_v0143_base_size(args, kwargs, atlas_text):
                  for wk, hk in (('texture_width','texture_height'), ('tex_width','tex_height'), ('width','height'), ('base_width','base_height'), ('image_width','image_height')):
                      if isinstance(kwargs.get(wk), int) and isinstance(kwargs.get(hk), int):
                          return int(kwargs[wk]), int(kwargs[hk])
                  for a in args[1:]:
                      if isinstance(a, (tuple, list)) and len(a) >= 2 and isinstance(a[0], int) and isinstance(a[1], int):
                          return int(a[0]), int(a[1])
                  ints = [int(a) for a in args[1:] if isinstance(a, int)]
                  if len(ints) >= 2:
                      return ints[0], ints[1]
                  return _nmm_v0143_needed_canvas(atlas_text, 0, 0)
              
              def _nmm_v0143_shape(result, atlas_text, need_w, need_h):
                  if isinstance(result, dict):
                      out = dict(result)
                      for k in ('atlas_text', 'atlas', 'sanitized_atlas', 'spine_atlas_text'):
                          if k in out: out[k] = atlas_text
                      for k in ('width', 'atlas_width', 'canvas_width', 'needed_width', 'spine_width'):
                          if isinstance(out.get(k), int): out[k] = need_w
                      for k in ('height', 'atlas_height', 'canvas_height', 'needed_height', 'spine_height'):
                          if isinstance(out.get(k), int): out[k] = need_h
                      return out
                  if isinstance(result, str):
                      return atlas_text
                  if not isinstance(result, (tuple, list)):
                      return result
                  seq = list(result)
                  ret = tuple if isinstance(result, tuple) else list
                  atlas_i = next((i for i,v in enumerate(seq) if isinstance(v, str) and ('bounds:' in v or '\nsize:' in v or '.png' in v)), None)
                  if atlas_i is None:
                      atlas_i = next((i for i,v in enumerate(seq) if isinstance(v, str)), None)
                  if atlas_i is not None:
                      seq[atlas_i] = atlas_text
                  for i,v in enumerate(seq):
                      if isinstance(v, tuple) and len(v) >= 2 and isinstance(v[0], int) and isinstance(v[1], int):
                          seq[i] = (need_w, need_h) + tuple(v[2:])
                      elif isinstance(v, list) and len(v) >= 2 and isinstance(v[0], int) and isinstance(v[1], int):
                          v[0], v[1] = need_w, need_h
                  start = (atlas_i + 1) if atlas_i is not None else 0
                  for i in range(start, len(seq)-1):
                      if isinstance(seq[i], int) and isinstance(seq[i+1], int):
                          seq[i], seq[i+1] = need_w, need_h
                          break
                  return ret(seq)
              
              def _sanitize_atlas(*args, **kwargs):
                  atlas_text = args[0] if args and isinstance(args[0], str) else ''
                  if not atlas_text:
                      for k in ('atlas_text', 'atlas', 'raw_atlas'):
                          if isinstance(kwargs.get(k), str):
                              atlas_text = kwargs[k]
                              break
                  bw, bh = _nmm_v0143_base_size(args, kwargs, atlas_text)
                  need_w, need_h = _nmm_v0143_needed_canvas(atlas_text, bw, bh)
                  if _nmm_v0143_original_sanitize_atlas is None:
                      return atlas_text, need_w, need_h, ['AtlasPreserveFix activo']
                  try:
                      old = _nmm_v0143_original_sanitize_atlas(*args, **kwargs)
                  except Exception:
                      return atlas_text, need_w, need_h, ['AtlasPreserveFix: sanitizer antiguo omitido']
                  return _nmm_v0143_shape(old, atlas_text, need_w, need_h)
              # --- end NMM v0.14.3 Atlas PreserveFix -------------------------------------
          ''')

          for p in files:
              s = p.read_text(encoding='utf-8', errors='ignore')
              p.with_suffix('.py.bak_v0143_atlaspreserve').write_text(s, encoding='utf-8')
              if 'from PIL import Image' not in s and 'import PIL.Image' not in s:
                  marker = 'from __future__ import annotations\n'
                  s = s.replace(marker, marker + 'from PIL import Image\n', 1) if marker in s else 'from PIL import Image\n' + s
              s = s.replace('from PIL import Image as PILImage', 'from PIL import Image')
              s = s.replace('img.__class__.new(', 'Image.new(')
              s = s.replace('image.__class__.new(', 'Image.new(')
              s = s.replace('PILImage.new(', 'Image.new(')
              if 'NMM v0.14.3 Atlas PreserveFix' not in s:
                  s = s.rstrip() + append + '\n'
              s = s.replace('NIKKE Mod Manager v0.14 Classic Integrated Viewer', 'NIKKE Mod Manager v0.14.3 Classic Integrated Viewer AtlasPreserveFix')
              s = s.replace('Classic v0.14 Integrated Viewer', 'Classic v0.14.3 AtlasPreserveFix')
              p.write_text(s, encoding='utf-8')
              compile(s, str(p), 'exec')
              print('patched', p)
          PY

      - name: Rename package and write notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('extracted')
          dirs = [p for p in root.iterdir() if p.is_dir()]
          app = dirs[0] if len(dirs) == 1 else root / 'NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer'
          target = root / 'NIKKE_Mod_Manager_v0_14_3_Classic_Integrated_Viewer_ATLASPRESERVE_FULL'
          if target.exists():
              import shutil; shutil.rmtree(target)
          if app != target:
              app.rename(target)
          for rel in ['VERSION.txt', 'LEEME_PRIMERO.txt']:
              p = target / rel
              old = p.read_text(encoding='utf-8', errors='ignore') if p.exists() else ''
              p.write_text('NIKKE Mod Manager v0.14.3 Classic Integrated Viewer AtlasPreserveFix FULL\n\nCorrige Region not found in atlas: conserva todas las regiones del atlas y expande el canvas transparente cuando el atlas supera la textura base. Tambien corrige el padding Pillow Image.new.\nInstalacion: descomprimir en carpeta nueva y ejecutar INSTALAR_Y_ABRIR.bat.\n\n' + old, encoding='utf-8')
          print(target)
          PY

      - name: Validate and zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out = Path('dist')
          out.mkdir(exist_ok=True)
          root = Path('extracted') / 'NIKKE_Mod_Manager_v0_14_3_Classic_Integrated_Viewer_ATLASPRESERVE_FULL'
          preview = root / 'src' / 'preview.py'
          appjs = root / 'web' / 'app.js'
          assert preview.exists(), 'preview.py missing'
          assert appjs.exists(), 'web/app.js missing'
          txt = preview.read_text(encoding='utf-8', errors='ignore')
          assert 'Atlas PreserveFix' in txt or 'AtlasPreserveFix' in txt, 'atlas preserve patch missing'
          assert 'Image.new(' in txt, 'Image.new not used'
          compile(txt, str(preview), 'exec')
          zip_path = out / 'NIKKE_Mod_Manager_v0_14_3_Classic_Integrated_Viewer_ATLASPRESERVE_FULL.zip'
          if zip_path.exists():
              zip_path.unlink()
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'zip corrupto: {bad}')
          print(zip_path, zip_path.stat().st_size)
          PY

      - name: Upload patched ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_14_3_Classic_Integrated_Viewer_ATLASPRESERVE_FULL
          path: dist/NIKKE_Mod_Manager_v0_14_3_Classic_Integrated_Viewer_ATLASPRESERVE_FULL.zip
          if-no-files-found: error
          retention-days: 90
