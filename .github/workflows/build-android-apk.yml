name: Inspect v0.14 Preview Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  inspect-v014-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAR_URL: 'https://eu-central.storage.cloudconvert.com/tasks/ab145fcb-621e-486c-a917-338556dfcc7e/NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer.tar?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260908%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260908T015517Z&X-Amz-Expires=86400&X-Amz-Signature=218c44397098afc5baad5de0fed57eda763a18c9c7ba1e090c4ae413f3e0e888&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22NIKKE_Mod_Manager_v0_14_Classic_Integrated_Viewer.tar%22&response-content-type=application%2Fx-tar&x-amz-checksum-mode=ENABLED&x-id=GetObject'
    steps:
      - name: Download and inspect source
        shell: bash
        run: |
          set -euo pipefail
          curl -L "$TAR_URL" -o source.tar
          mkdir extracted
          tar -xf source.tar -C extracted
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path('extracted').rglob('src/preview.py'))
          s = p.read_text(encoding='utf-8', errors='ignore')
          print('PATH', p)
          print('LEN', len(s))
          keys = ['def _sanitize_atlas', 'def _pad_image_to', 'def _atlas_needed_canvas', '_sanitize_atlas(', '_pad_image_to(', 'spine_preview']
          lines = s.splitlines()
          for key in keys:
              print('\n### KEY', key)
              for i,l in enumerate(lines,1):
                  if key in l:
                      print('@@', i, l[:220])
                      a=max(1,i-12); b=min(len(lines),i+45)
                      for j in range(a,b+1):
                          print(f'{j:04d}: {lines[j-1]}')
                      print('---')
          PY
