name: Build Classic R5 Spine Debug FULL Artifact

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-classic-r5-spine-debug-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovered classic source
        uses: actions/checkout@v4
        with:
          ref: recover-v011-source
          fetch-depth: 1

      - name: Build ZIP with bundled Spine runtime and debug
        run: python3 tools/build_classic_r5_debugfix.py

      - name: Upload FULL artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_13_CLASSIC_R5_SPINE_DEBUG_FULL
          path: dist/NIKKE_Mod_Manager_v0_13_CLASSIC_R5_SPINE_DEBUG_FULL.zip
          if-no-files-found: error
          retention-days: 90

