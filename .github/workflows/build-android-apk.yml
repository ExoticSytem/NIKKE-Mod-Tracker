name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'assets/characters/**'
      - 'catalog/**'
      - 'admin/catalog_overrides.json'
      - 'README.md'
      - 'ADMIN_GUIDE.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct base Android project
        shell: bash
        run: |
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.part05 source.part06 | base64 --decode > source.zip
          unzip -t source.zip
          mkdir -p buildsrc
          unzip -q source.zip -d buildsrc
          rm -rf buildsrc/.github
          cp overrides/MainActivity.java buildsrc/app/src/main/java/com/maxi/nikkemodtracker/MainActivity.java
          cp overrides/AndroidManifest.xml buildsrc/app/src/main/AndroidManifest.xml
          cp overrides/app-build.gradle buildsrc/app/build.gradle
          cp overrides/index.html buildsrc/app/src/main/assets/index.html
          cp overrides/styles.css buildsrc/app/src/main/assets/styles.css
          cp overrides/app.js buildsrc/app/src/main/assets/app.js
          cp overrides/fixes.js buildsrc/app/src/main/assets/fixes.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk output/NIKKE-Mod-Tracker-v0.2.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Mod-Tracker-Android-v0.2.5
          path: output/NIKKE-Mod-Tracker-v0.2.5.apk
          if-no-files-found: error
          retention-days: 30
