name: Build v0.16.0 Integrated SpinePlayer

on:
  push:
    branches:
      - nmm-v016-viewer-integration
    paths:
      - '.github/workflows/build-v0160-integrated-spineplayer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0160:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_ID: '10040876556'
      OUT_NAME: 'NIKKE_Mod_Manager_v0_16_0_Integrated_SpinePlayer_FULL'
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: nmm-v016-viewer-integration

      - name: Download v0.15.2 base artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o artifact.zip
          rm -rf artifact extracted
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          appzip="$(find artifact -type f -name '*.zip' | head -n 1 || true)"
          if [ -n "$appzip" ]; then
            unzip -q "$appzip" -d extracted
          else
            cp -R artifact/* extracted/ || true
          fi
          root="$(dirname "$(dirname "$(find extracted -type f -path '*/web/app.js' | head -n 1)")")"
          test -n "$root"
          newroot="extracted/${OUT_NAME}"
          if [ "$root" != "$newroot" ]; then
            rm -rf "$newroot"
            mv "$root" "$newroot"
          fi
          echo "APP_ROOT=$newroot" >> "$GITHUB_ENV"

      - name: Vendor NIKKE SpinePlayer runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_ROOT/web/assets/vendor/spineplayer"
          curl -fL "https://raw.githubusercontent.com/Nikke-db/spine-web-player-template/main/spine/spine-player40.js" -o "$APP_ROOT/web/assets/vendor/spineplayer/spine-player40.js"
          curl -fL "https://raw.githubusercontent.com/Nikke-db/spine-web-player-template/main/spine/spine-player41.js" -o "$APP_ROOT/web/assets/vendor/spineplayer/spine-player41.js"
          curl -fL "https://raw.githubusercontent.com/Nikke-db/spine-web-player-template/main/css/spine-player.css" -o "$APP_ROOT/web/assets/vendor/spineplayer/spine-player.css"
          test -s "$APP_ROOT/web/assets/vendor/spineplayer/spine-player40.js"
          test -s "$APP_ROOT/web/assets/vendor/spineplayer/spine-player41.js"
          test -s "$APP_ROOT/web/assets/vendor/spineplayer/spine-player.css"

      - name: Apply v0.16 viewer replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_v016_patch.py "$APP_ROOT"

      - name: Validate code and package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$APP_ROOT/src/preview.py" "$APP_ROOT/src/api.py" "$APP_ROOT/app.py"
          node --check "$APP_ROOT/web/app.js"
          grep -q "v0_16_spineplayer_multipage" "$APP_ROOT/src/preview.py"
          grep -q "NMM v0.16.0" "$APP_ROOT/web/app.js"
          grep -q "spine-player40.js" "$APP_ROOT/web/index.html"
          grep -q "spine-player41.js" "$APP_ROOT/web/index.html"
          cd extracted
          zip -qr "../${OUT_NAME}.zip" "$OUT_NAME"
          cd ..
          unzip -t "${OUT_NAME}.zip" >/dev/null
          ls -lh "${OUT_NAME}.zip"

      - name: Upload v0.16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_16_0_Integrated_SpinePlayer_FULL
          path: NIKKE_Mod_Manager_v0_16_0_Integrated_SpinePlayer_FULL.zip
          if-no-files-found: error
