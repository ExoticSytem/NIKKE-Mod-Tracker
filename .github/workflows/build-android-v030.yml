name: Build Android v0.3.0

on:
  push:
    branches: [ android-v0-3-0-build ]
    paths:
      - 'android_v030/**'
      - '.github/workflows/build-android-v030.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android_v030 :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android_v030/app/build/outputs/apk/debug/app-debug.apk NIKKE_Mod_Tracker_v0.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Mod-Tracker-v0.3.0
          path: NIKKE_Mod_Tracker_v0.3.0.apk
          if-no-files-found: error
