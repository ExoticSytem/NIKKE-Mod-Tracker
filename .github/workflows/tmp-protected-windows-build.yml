name: Temporary protected Windows EXE build

on:
  push:
    branches: ['tmp/protected-exe-build']
    paths: ['.tmp-build/run.txt']

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_URL: 'https://eu-central.storage.cloudconvert.com/tasks/3fe4bdbc-be67-4fe1-b730-506a4fd511af/source%2Csource.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260913%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260913T034738Z&X-Amz-Expires=86400&X-Amz-Signature=a78fce8b24fe3b8a03cced29296e1d0c73e863d6583bb401722eb38794e873b0&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22source%2Csource.zip%22&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject'
    steps:
      - name: Download encrypted build payload
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile transfer.zip
          Expand-Archive transfer.zip encrypted -Force

      - name: Download ephemeral private key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'}
          $p = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=nmm-private-build-key&per_page=10"
          $a = $p.artifacts | Where-Object {-not $_.expired} | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $a) { throw 'Private build key artifact not found' }
          Invoke-WebRequest -Headers $h -Uri $a.archive_download_url -OutFile key.zip
          Expand-Archive key.zip key -Force

      - name: Decrypt source
        shell: pwsh
        run: |
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          & $openssl pkeyutl -decrypt -inkey key/private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in encrypted/source.key -out keyiv.bin
          if ($LASTEXITCODE -ne 0) { throw 'RSA decrypt failed' }
          $b=[IO.File]::ReadAllBytes((Resolve-Path keyiv.bin))
          $k=-join ($b[0..31] | % {$_.ToString('x2')})
          $iv=-join ($b[32..47] | % {$_.ToString('x2')})
          & $openssl enc -d -aes-256-cbc -K $k -iv $iv -in encrypted/source.enc -out source.zip
          if ($LASTEXITCODE -ne 0) { throw 'AES decrypt failed' }
          Expand-Archive source.zip source -Force
          if (-not (Test-Path source/app.py)) { throw 'Source payload incomplete' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set

      - name: Compile with Nuitka
        shell: pwsh
        working-directory: source
        run: |
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=send2trash `
            --include-package=qrcode `
            --include-package=UnityPy `
            --include-package=Crypto `
            --include-package=zstandard `
            --include-package=lz4 `
            --include-data-dir=web=web `
            --include-data-dir=data=data `
            --include-data-dir=Backups=Backups `
            --include-data-files=VERSION.txt=VERSION.txt `
            --include-data-files=ABOUT_PROJECT_ES_EN.txt=ABOUT_PROJECT_ES_EN.txt `
            --include-data-files=LEEME_EJECUTABLE.txt=LEEME_EJECUTABLE.txt `
            --output-dir=build `
            --output-filename=NIKKE_Mod_Manager.exe `
            app.py

      - name: Prepare distribution
        shell: pwsh
        working-directory: source
        run: |
          $dist=Get-ChildItem build -Directory -Filter '*.dist' | Select-Object -First 1
          if (-not $dist) { throw 'Nuitka dist not found' }
          $out=Join-Path (Resolve-Path build) 'NIKKE_Mod_Manager_v0_34_9_Windows'
          Move-Item $dist.FullName $out
          if (-not (Test-Path (Join-Path $out 'NIKKE_Mod_Manager.exe'))) { throw 'EXE missing' }
          @('NIKKE Mod Manager v0.34.9 - compiled Windows distribution','Backend compiled with Nuitka. Python project source files are not included.','Repack and Viewer are experimental/testing features.','Keep the complete folder together; do not move only the EXE.') | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_INFO.txt')
          $ownPy=Get-ChildItem $out -Recurse -File -Filter '*.py' | Where-Object {$_.FullName -match '\\src\\|\\app\.py$'}
          if ($ownPy) { throw 'Application Python source present in distribution' }
          Get-FileHash (Join-Path $out 'NIKKE_Mod_Manager.exe') -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_34_9_Windows_Compiled
          path: source/build/NIKKE_Mod_Manager_v0_34_9_Windows
          retention-days: 1
          if-no-files-found: error
