name: Temporary protected Windows EXE build

on:
  push:
    branches:
      - 'tmp/protected-exe-build'
    paths:
      - '.tmp-build/run.txt'

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_URL: 'https://eu-central.storage.cloudconvert.com/tasks/3fe4bdbc-be67-4fe1-b730-506a4fd511af/source%2Csource.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260913%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260913T034738Z&X-Amz-Expires=86400&X-Amz-Signature=a78fce8b24fe3b8a03cced29296e1d0c73e863d6583bb401722eb38794e873b0&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22source%2Csource.zip%22&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Download encrypted source transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile source-transfer.zip
          Expand-Archive -Path source-transfer.zip -DestinationPath encrypted -Force
          if (-not (Test-Path encrypted/source.enc)) { throw 'source.enc missing.' }
          if (-not (Test-Path encrypted/source.key)) { throw 'source.key missing.' }

      - name: Download ephemeral private key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=nmm-private-build-key&per_page=10"
          $payload = Invoke-RestMethod -Headers $headers -Uri $uri
          $artifact = $payload.artifacts | Where-Object { -not $_.expired } | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $artifact) { throw 'Ephemeral private build key artifact not found.' }
          Invoke-WebRequest -Headers $headers -Uri $artifact.archive_download_url -OutFile build-key.zip
          Expand-Archive -Path build-key.zip -DestinationPath build-key -Force
          if (-not (Test-Path build-key/private.pem)) { throw 'private.pem missing from build key artifact.' }

      - name: Decrypt private source payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          if (-not (Test-Path $openssl)) { $openssl = 'openssl' }
          & $openssl pkeyutl -decrypt -inkey build-key/private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in encrypted/source.key -out keyiv.bin
          if ($LASTEXITCODE -ne 0) { throw 'RSA decryption failed.' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path keyiv.bin))
          if ($bytes.Length -ne 48) { throw "Invalid AES key payload length: $($bytes.Length)" }
          $key = -join ($bytes[0..31] | ForEach-Object { $_.ToString('x2') })
          $iv  = -join ($bytes[32..47] | ForEach-Object { $_.ToString('x2') })
          & $openssl enc -d -aes-256-cbc -K $key -iv $iv -in encrypted/source.enc -out source.zip
          if ($LASTEXITCODE -ne 0) { throw 'AES decryption failed.' }
          Expand-Archive -Path source.zip -DestinationPath source -Force
          if (-not (Test-Path source/app.py)) { throw 'Decrypted source payload is incomplete.' }
          Remove-Item keyiv.bin, source.zip, source-transfer.zip, build-key.zip -Force -ErrorAction SilentlyContinue
          Remove-Item encrypted, build-key -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install compiler and runtime dependencies
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set

      - name: Compile standalone Windows distribution with Nuitka
        shell: pwsh
        working-directory: source
        run: |
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=webview `
            --include-package-data=webview `
            --include-package=send2trash `
            --include-package=qrcode `
            --include-package=UnityPy `
            --include-package=Crypto `
            --include-package=zstandard `
            --include-package=lz4 `
            --include-data-dir=web=web `
            --include-data-dir=data=data `
            --include-data-dir=Backups=Backups `
            --include-data-files=VERSION.txt=VERSION.txt `
            --include-data-files=ABOUT_PROJECT_ES_EN.txt=ABOUT_PROJECT_ES_EN.txt `
            --include-data-files=LEEME_EJECUTABLE.txt=LEEME_EJECUTABLE.txt `
            --output-dir=build `
            --output-filename=NIKKE_Mod_Manager.exe `
            app.py

      - name: Prepare clean distributable
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Get-ChildItem build -Directory -Filter '*.dist' | Select-Object -First 1
          if (-not $dist) { throw 'Nuitka standalone .dist directory not found.' }
          $out = Join-Path (Resolve-Path build) 'NIKKE_Mod_Manager_v0_34_9_Windows'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          Move-Item $dist.FullName $out
          if (-not (Test-Path (Join-Path $out 'NIKKE_Mod_Manager.exe'))) { throw 'NIKKE_Mod_Manager.exe was not generated.' }
          @"
NIKKE Mod Manager v0.34.9 — compiled Windows distribution
Backend compiled with Nuitka. Python project source files are not included.
Repack and Viewer are experimental/testing features.
Keep the complete folder together; do not move only the EXE.
"@ | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_INFO.txt')
          $ownPy = Get-ChildItem $out -Recurse -File -Filter '*.py' | Where-Object { $_.FullName -match '\\src\\|\\app\.py$' }
          if ($ownPy) { throw 'Application Python source unexpectedly present in compiled distribution.' }
          Get-FileHash (Join-Path $out 'NIKKE_Mod_Manager.exe') -Algorithm SHA256 | Format-List

      - name: Upload compiled manager
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_34_9_Windows_Compiled
          path: source/build/NIKKE_Mod_Manager_v0_34_9_Windows
          retention-days: 1
          if-no-files-found: error
