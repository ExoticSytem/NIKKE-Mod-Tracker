name: Build v0.15.2 RegionFallback from v0.15.1 Artifact

on:
  push:
    paths:
      - '.github/workflows/build-v0152-regionfallback-from-v0151-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0152-regionfallback:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_ID: '10040735190'
      OUT_NAME: 'NIKKE_Mod_Manager_v0_15_2_Classic_Integrated_Viewer_REGIONFALLBACK_FULL'
    steps:
      - name: Download v0.15.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o artifact.zip
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          appzip="$(find artifact -type f -name '*.zip' | head -n 1 || true)"
          if [ -n "$appzip" ]; then
            unzip -q "$appzip" -d extracted
          else
            cp -R artifact/* extracted/ || true
          fi
          echo "Extracted roots:"
          find extracted -maxdepth 2 -type f | sed -n '1,40p'

      - name: Apply v0.15.2 region fallback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, shutil

          root_candidates = []
          for appjs in Path('extracted').rglob('web/app.js'):
              root_candidates.append(appjs.parent.parent)
          if not root_candidates:
              raise SystemExit('No web/app.js found')
          root = root_candidates[0]
          print('APP_ROOT=', root)

          # Rename root folder for clear versioning.
          new_root = root.parent / 'NIKKE_Mod_Manager_v0_15_2_Classic_Integrated_Viewer_REGIONFALLBACK_FULL'
          if root != new_root:
              if new_root.exists():
                  shutil.rmtree(new_root)
              root.rename(new_root)
              root = new_root

          V152_PATCH = r'''
          // --- NMM v0.15.2 RegionFallback hard patch -------------------------
          (function(){
            if (window.__NMM_V0152_REGIONFALLBACK__) return;
            window.__NMM_V0152_REGIONFALLBACK__ = true;
            window.__NMM_LAST_RUNTIME_STACK = window.__NMM_LAST_RUNTIME_STACK || '';
            window.__NMM_REGION_FALLBACK_LOG = [];

            function log(msg){
              try { window.__NMM_REGION_FALLBACK_LOG.push(String(msg)); if (window.__NMM_REGION_FALLBACK_LOG.length > 60) window.__NMM_REGION_FALLBACK_LOG.shift(); } catch(e) {}
            }
            function clean(v){
              if (v === null || v === undefined) return '';
              v = String(v);
              if (v === 'null' || v === 'undefined' || v === '[object Object]') return '';
              return v.trim();
            }
            function trimSeq(s){
              s = clean(s);
              if (!s) return '';
              return s.replace(/0{8,}\d{1,4}$/,'').replace(/\d{16,}$/,'').replace(/_?\d{8,}$/,'');
            }
            function variants(){
              var out = [];
              for (var i=0;i<arguments.length;i++) {
                var s = clean(arguments[i]);
                if (!s) continue;
                out.push(s);
                var t = trimSeq(s); if (t && t !== s) out.push(t);
                if (s.indexOf('/') >= 0) out.push(s.split('/').pop());
                if (s.indexOf('\\\\') >= 0) out.push(s.split('\\\\').pop());
                if (s.indexOf('.') >= 0) out.push(s.replace(/\.[^.]+$/,''));
              }
              // NIKKE common fallback sequence names, conservative but useful.
              out.push('body_t','body','head_t','face_t','hair_t','weapon_t','effect_t','c015_aim_00');
              var seen = Object.create(null), uniq=[];
              out.forEach(function(x){ x=clean(x); if (x && !seen[x]) { seen[x]=1; uniq.push(x); } });
              return uniq;
            }
            function getRegions(atlas){
              var arr = [];
              try {
                if (atlas && Array.isArray(atlas.regions)) arr = arr.concat(atlas.regions);
                if (atlas) Object.keys(atlas).forEach(function(k){
                  var v = atlas[k];
                  if (Array.isArray(v)) v.forEach(function(r){ if (r && (r.name || r.texture || r.page)) arr.push(r); });
                });
              } catch(e) {}
              var seen=[], out=[];
              arr.forEach(function(r){ if (r && seen.indexOf(r) < 0) { seen.push(r); out.push(r); } });
              return out;
            }
            function firstRegion(atlas){
              var rs = getRegions(atlas);
              for (var i=0;i<rs.length;i++) if (rs[i] && rs[i].name && rs[i].name.indexOf('__') !== 0) return rs[i];
              return rs[0] || null;
            }
            function findLoose(atlas){
              var cands = variants.apply(null, Array.prototype.slice.call(arguments,1));
              var rs = getRegions(atlas);
              for (var c=0;c<cands.length;c++) {
                var want = cands[c];
                for (var i=0;i<rs.length;i++) {
                  var rn = clean(rs[i] && rs[i].name);
                  if (!rn) continue;
                  if (rn === want || rn.toLowerCase() === want.toLowerCase() || trimSeq(rn) === trimSeq(want)) return rs[i];
                }
              }
              return null;
            }
            function safeName(name, path, seq, region){
              return clean(name) || clean(path) || clean(seq && (seq.name || seq.basePath || seq.path)) || clean(region && region.name) || '__nmm_attachment_auto';
            }
            function safePath(name, path, seq, region){
              return clean(path) || clean(name) || clean(seq && (seq.name || seq.basePath || seq.path)) || clean(region && region.name) || 'body_t';
            }
            function regionFor(atlas, name, path, seq){
              var seqName = seq && (seq.name || seq.basePath || seq.path || seq.prefix);
              var r = findLoose(atlas, path, name, seqName);
              if (!r) r = firstRegion(atlas);
              if (!r) log('No atlas region available at all');
              else log('regionFor name=' + clean(name) + ' path=' + clean(path) + ' seq=' + clean(seqName) + ' => ' + clean(r.name));
              return r;
            }
            function patchAtlas(ns){
              if (!ns || !ns.TextureAtlas || !ns.TextureAtlas.prototype) return;
              var proto = ns.TextureAtlas.prototype;
              if (!proto.__nmm_v0152_findRegion) {
                var old = proto.findRegion;
                proto.findRegion = function(name){
                  try {
                    var cands = variants(name);
                    for (var i=0;i<cands.length;i++) {
                      try {
                        var r = old && old.call(this, cands[i]);
                        if (r) return r;
                      } catch(e) {}
                      var loose = findLoose(this, cands[i]);
                      if (loose) return loose;
                    }
                    var fallback = firstRegion(this);
                    if (fallback) { log('findRegion fallback for ' + clean(name) + ' => ' + clean(fallback.name)); return fallback; }
                    return null;
                  } catch(e) {
                    try { window.__NMM_LAST_RUNTIME_STACK = (e && (e.stack || e.message)) || String(e); } catch(_) {}
                    var fb = firstRegion(this);
                    if (fb) return fb;
                    return null;
                  }
                };
                proto.__nmm_v0152_findRegion = true;
              }
            }
            function patchLoader(ns){
              if (!ns || !ns.AtlasAttachmentLoader || !ns.AtlasAttachmentLoader.prototype) return;
              var L = ns.AtlasAttachmentLoader.prototype;
              if (L.__nmm_v0152_loader) return;
              function atlasOf(loader){ return loader.atlas || loader.textureAtlas || loader._atlas || loader._textureAtlas; }
              L.newRegionAttachment = function(skin, name, path, sequence){
                var atlas = atlasOf(this);
                var region = regionFor(atlas, name, path, sequence);
                var finalName = safeName(name, path, sequence, region);
                var finalPath = safePath(name, path, sequence, region);
                var a = ns.RegionAttachment ? new ns.RegionAttachment(finalName) : {name: finalName, type: 0};
                a.name = a.name || finalName; a.path = finalPath; a.region = region;
                if (a.setRegion && region) { try { a.setRegion(region); } catch(e) {} }
                if (sequence) a.sequence = sequence;
                return a;
              };
              L.newMeshAttachment = function(skin, name, path, sequence){
                var atlas = atlasOf(this);
                var region = regionFor(atlas, name, path, sequence);
                var finalName = safeName(name, path, sequence, region);
                var finalPath = safePath(name, path, sequence, region);
                var a = ns.MeshAttachment ? new ns.MeshAttachment(finalName) : {name: finalName, type: 1};
                a.name = a.name || finalName; a.path = finalPath; a.region = region;
                if (a.setRegion && region) { try { a.setRegion(region); } catch(e) {} }
                if (sequence) a.sequence = sequence;
                return a;
              };
              [['newBoundingBoxAttachment','BoundingBoxAttachment'],['newPathAttachment','PathAttachment'],['newPointAttachment','PointAttachment'],['newClippingAttachment','ClippingAttachment']].forEach(function(pair){
                L[pair[0]] = function(skin, name){
                  var finalName = safeName(name, pair[0]);
                  var C = ns[pair[1]];
                  var a = C ? new C(finalName) : {name: finalName};
                  a.name = a.name || finalName;
                  return a;
                };
              });
              L.__nmm_v0152_loader = true;
            }
            function patchCtor(ns){
              if (!ns) return;
              ['Attachment','RegionAttachment','MeshAttachment','PointAttachment','BoundingBoxAttachment','PathAttachment','ClippingAttachment'].forEach(function(k){
                var C = ns[k];
                if (!C || C.__nmm_v0152_ctor) return;
                try {
                  var W = function(name){ return new (Function.prototype.bind.call(C, null, safeName(name, k)))(); };
                  W.prototype = C.prototype;
                  Object.keys(C).forEach(function(p){ try { W[p]=C[p]; } catch(e){} });
                  W.__nmm_v0152_ctor = true;
                  ns[k] = W;
                } catch(e) {}
              });
            }
            function patchAll(){
              try {
                var list = [window.pixi_spine, window.spine, window.spine38, window.spine41, window.PIXI && window.PIXI.spine].filter(Boolean);
                list.forEach(function(ns){ patchCtor(ns); patchAtlas(ns); patchLoader(ns); });
              } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_) {} }
            }
            patchAll();
            var n=0, t=setInterval(function(){ patchAll(); if (++n>250) clearInterval(t); }, 50);

            var oldDiag = window.__nmmRuntimeDiagnostic;
            window.__nmmRuntimeDiagnostic = function(){
              var s = oldDiag ? oldDiag() : 'NMM RUNTIME DIAGNOSTIC v0.15.2';
              try { s += '\nREGION_FALLBACK_LOG=' + window.__NMM_REGION_FALLBACK_LOG.join(' || '); } catch(e) {}
              try { s = s.replace(/v0\.15\.1/g, 'v0.15.2'); } catch(e) {}
              return s;
            };
          })();
          // --- end NMM v0.15.2 ----------------------------------------------
          '''

          appjs = root / 'web' / 'app.js'
          js = appjs.read_text(encoding='utf-8', errors='ignore')
          appjs.with_suffix('.js.bak_v0152_regionfallback').write_text(js, encoding='utf-8')
          js = js.replace('v0.15.1', 'v0.15.2')
          js = js.replace('VENDOR_ATTACHMENT_FIX', 'REGIONFALLBACK')
          js = js.replace('VendorAttachmentFix', 'RegionFallback')
          if 'NMM v0.15.2 RegionFallback hard patch' not in js:
              js += '\n' + V152_PATCH + '\n'
          appjs.write_text(js, encoding='utf-8')

          # Patch vendor JS too: make any explicit Region-not-found throw non-fatal.
          for vend in list((root / 'web' / 'assets' / 'vendor').rglob('*.js')):
              txt = vend.read_text(encoding='utf-8', errors='ignore')
              if 'Region not found in atlas' in txt or 'Attachment name must not be null' in txt:
                  vend.with_suffix(vend.suffix + '.bak_v0152').write_text(txt, encoding='utf-8')
                  txt = txt.replace('v0.15.1', 'v0.15.2')
                  txt = re.sub(r'throw\s+new\s+Error\(([^;]*Region not found in atlas[^;]*)\);',
                               r'console.warn("NMM v0.15.2 swallowed region error", \1); return null;', txt)
                  txt = txt.replace('throw new Error("Attachment name must not be null")', 'console.warn("NMM v0.15.2 attachment name null"); name = "__nmm_attachment_auto"')
                  txt = txt.replace("throw new Error('Attachment name must not be null')", "console.warn('NMM v0.15.2 attachment name null'); name = '__nmm_attachment_auto'")
                  vend.write_text(txt, encoding='utf-8')
                  print('patched vendor', vend)

          # Update text files.
          for rel in ['VERSION.txt', 'LEEME_PRIMERO.txt', 'DIAGNOSTICO_RUNTIME.md']:
              p = root / rel
              old = p.read_text(encoding='utf-8', errors='ignore') if p.exists() else ''
              p.write_text('NIKKE Mod Manager v0.15.2 Classic Integrated Viewer RegionFallback FULL\n\n'
                           'Corrige/flexibiliza Region not found in atlas: undefined y mantiene diagnostico.\n\n' + old,
                           encoding='utf-8')

          # Validate.
          compile((root / 'src' / 'preview.py').read_text(encoding='utf-8', errors='ignore'), str(root / 'src' / 'preview.py'), 'exec')
          assert 'NMM v0.15.2 RegionFallback hard patch' in appjs.read_text(encoding='utf-8', errors='ignore')
          print('OK v0.15.2 patch applied')
          PY

      - name: Zip artifact
        shell: bash
        run: |
          set -euo pipefail
          cd extracted
          zip -qr "../${OUT_NAME}.zip" .
          cd ..
          unzip -t "${OUT_NAME}.zip" >/dev/null
          ls -lh "${OUT_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_15_2_Classic_Integrated_Viewer_REGIONFALLBACK_FULL
          path: NIKKE_Mod_Manager_v0_15_2_Classic_Integrated_Viewer_REGIONFALLBACK_FULL.zip
          if-no-files-found: error
