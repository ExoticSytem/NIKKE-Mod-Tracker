name: Sync upstream catalog and images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-upstream-content.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Reconstruct protected base catalog
        shell: bash
        run: |
          mkdir -p catalog
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.part05 source.part06 | base64 --decode > /tmp/source.zip
          unzip -p /tmp/source.zip app/src/main/assets/catalog.json > catalog/base_catalog.json

      - name: Fetch Nikke-DB data and full-body images
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Nikke-db/Nikke-db.github.io.git upstream
          git -C upstream sparse-checkout set images/FB js/json
          git -C upstream checkout
          git -C upstream rev-parse HEAD > /tmp/upstream_sha.txt

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Discover new characters and mirror matched images
        shell: python
        run: |
          import json, re, unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          base = json.loads((root/'catalog/base_catalog.json').read_text(encoding='utf-8'))
          base_chars = [dict(x) for x in base.get('characters', []) if isinstance(x, dict)]
          discovered_path = root/'catalog/discovered.json'
          if discovered_path.exists():
              try:
                  discovered_payload = json.loads(discovered_path.read_text(encoding='utf-8'))
              except Exception:
                  discovered_payload = {}
          else:
              discovered_payload = {}
          discovered = [dict(x) for x in discovered_payload.get('characters', []) if isinstance(x, dict)]

          remote = json.loads((root/'upstream/js/json/l2d.json').read_text(encoding='utf-8'))
          ID_RE = re.compile(r'^c(?P<id>\d{3,4})(?:_(?P<ver>\d{2}))?$')

          def norm(value):
              s = unicodedata.normalize('NFKD', str(value or '')).encode('ascii','ignore').decode('ascii')
              s = s.lower().replace('_',' ')
              s = re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          def usable(name):
              n = str(name or '').strip()
              if not n: return False
              low = n.lower()
              if low.endswith('_old') or low.endswith(' old') or '_old_' in low: return False
              return not re.fullmatch(r'c\d{3,4}(?:_\d{2})?', n, re.I)

          current = base_chars + discovered
          known_keys = {str(c.get('key') or f"{c.get('id','')}_{c.get('version','00')}") for c in current}
          known_names = {norm(c.get('name')) for c in current if c.get('name')}

          def project_version(cid, remote_ver, name):
              rv = int(remote_ver or '00')
              same = [c for c in current if str(c.get('id')) == cid]
              target = norm(name)
              for c in same:
                  if norm(c.get('name')) == target:
                      return str(c.get('version','00')).zfill(2)
              official_by_name = {}
              for c in same:
                  v = str(c.get('version',''))
                  if v.isdigit() and c.get('name'):
                      official_by_name[norm(c.get('name'))] = int(v)
              anchors = []
              for e in remote:
                  if not isinstance(e, dict): continue
                  m = ID_RE.fullmatch(str(e.get('id','')).strip())
                  if not m or m.group('id') != cid: continue
                  off = official_by_name.get(norm(e.get('name')))
                  if off is not None:
                      anchors.append((int(m.group('ver') or '00'), off))
              if anchors:
                  eligible = [a for a in anchors if a[0] <= rv]
                  a = max(eligible or anchors, key=lambda x:x[0])
                  projected = a[1] + (rv-a[0])
                  if projected >= 0:
                      return f'{projected:02d}'
              return f'{rv:02d}'

          added = []
          for e in remote:
              if not isinstance(e, dict): continue
              m = ID_RE.fullmatch(str(e.get('id','')).strip())
              if not m: continue
              name = str(e.get('name','')).strip()
              if not usable(name): continue
              n = norm(name)
              if not n or n in known_names: continue
              cid = m.group('id')
              rver = m.group('ver') or '00'
              ver = project_version(cid, rver, name)
              key = f'{cid}_{ver}'
              if key in known_keys: continue
              row = {
                  'id': cid,
                  'version': ver,
                  'key': key,
                  'name': name,
                  'catalog_source': 'nikke_db_online',
                  'source_id': str(e.get('id','')).strip(),
                  'source_version': rver,
                  'needs_review': True,
                  'discovered_at': datetime.now(timezone.utc).isoformat()
              }
              discovered.append(row)
              current.append(row)
              added.append(row)
              known_keys.add(key)
              known_names.add(n)

          discovered_payload = {
              'version': 1,
              'source': 'https://github.com/Nikke-db/Nikke-db.github.io',
              'last_checked': datetime.now(timezone.utc).isoformat(),
              'source_entries': len(remote),
              'characters': discovered,
          }
          discovered_path.write_text(json.dumps(discovered_payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          # Match official/display names back to Nikke-DB source IDs. This avoids
          # legacy suffix shifts such as Rapi_old moving later cosmetic suffixes.
          remote_by_name = {}
          for e in remote:
              if not isinstance(e, dict): continue
              rid = str(e.get('id','')).strip()
              if not ID_RE.fullmatch(rid): continue
              remote_by_name.setdefault(norm(e.get('name')), []).append(rid)

          fb = root/'upstream/images/FB'
          out_dir = root/'assets/characters/library'
          out_dir.mkdir(parents=True, exist_ok=True)
          manual = root/'assets/characters/manual'

          def source_candidates(c):
              out = []
              if c.get('source_id'):
                  out.append(str(c['source_id']))
              matches = remote_by_name.get(norm(c.get('name')), [])
              # Prefer a source ID sharing the same numeric base ID.
              same = [x for x in matches if re.match(rf'^c{re.escape(str(c.get("id","")))}(?:_|$)', x)]
              out.extend(same or matches)
              official = f"c{c.get('id','')}_{str(c.get('version','00')).zfill(2)}"
              out.append(official)
              if str(c.get('version','00')).zfill(2) == '00':
                  out.append(f"c{c.get('id','')}")
              seen=[]
              for x in out:
                  if x and x not in seen: seen.append(x)
              return seen

          def find_source(c):
              for stem in source_candidates(c):
                  direct = fb/f'{stem}.png'
                  if direct.exists(): return direct
                  direct2 = fb/f'{stem}_00.png'
                  if direct2.exists(): return direct2
                  found = sorted(fb.glob(f'{stem}*.png'))
                  if found: return found[0]
              return None

          mirrored = 0
          for c in current:
              cid = str(c.get('id','')).strip(); ver = str(c.get('version','00')).zfill(2)
              if not cid: continue
              key = f'{cid}_{ver}'
              src = find_source(c)
              if not src: continue
              target = out_dir/f'c{key}.webp'
              try:
                  with Image.open(src) as im:
                      im.load()
                      if im.mode not in ('RGB','RGBA'):
                          im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                      im.thumbnail((1400, 2000), Image.Resampling.LANCZOS)
                      im.save(target, 'WEBP', quality=90, method=6)
                  mirrored += 1
              except Exception as exc:
                  print(f'Could not mirror {src}: {exc}')

          # Build manifest. Manual overrides are always first.
          images = {}
          allowed = {'.png','.webp','.jpg','.jpeg'}
          for folder in ('manual','library'):
              d = root/'assets/characters'/folder
              if not d.exists(): continue
              for p in sorted(d.iterdir()):
                  if not p.is_file() or p.suffix.lower() not in allowed: continue
                  stem = p.stem
                  if not stem.startswith('c') or '_' not in stem: continue
                  key = stem[1:]
                  images.setdefault(key, []).append(str(p).replace('\\','/'))
          for key, paths in images.items():
              paths.sort(key=lambda x:(0 if '/manual/' in x else 1, x))
          (root/'assets/characters/manifest.json').write_text(json.dumps({
              'version': 2,
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'images': images,
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          state = {
              'upstream_sha': Path('/tmp/upstream_sha.txt').read_text().strip(),
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'base_count': len(base_chars),
              'discovered_count': len(discovered),
              'new_this_run': len(added),
              'mirrored_images': mirrored,
          }
          (root/'catalog/sync_state.json').write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(state, indent=2))

      - name: Commit synchronized content
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/base_catalog.json catalog/discovered.json catalog/sync_state.json assets/characters/library assets/characters/manifest.json
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
            exit 0
          fi
          git commit -m 'Sync upstream NIKKE catalog and character images'
          git push
