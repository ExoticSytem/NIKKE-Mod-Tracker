name: Build v0.15.4 RegionUpdateFixSafe from v0.15.2 Artifact

on:
  push:
    paths:
      - '.github/workflows/build-v0154-region-updatefix-safe-from-v0152-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0154-region-updatefix-safe:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_ID: '10040876556'
      OUT_NAME: 'NIKKE_Mod_Manager_v0_15_4_Classic_Integrated_Viewer_REGION_UPDATEFIX_SAFE_FULL'
    steps:
      - name: Download v0.15.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o artifact.zip
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          appzip="$(find artifact -type f -name '*.zip' | head -n 1 || true)"
          if [ -n "$appzip" ]; then
            unzip -q "$appzip" -d extracted
          else
            cp -R artifact/* extracted/ || true
          fi
          find extracted -maxdepth 3 -type f | sed -n '1,80p'

      - name: Apply v0.15.4 safe region updateRegion patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          roots = [p.parent.parent for p in Path('extracted').rglob('web/app.js')]
          if not roots:
              raise SystemExit('No web/app.js found')
          root = roots[0]
          new_root = root.parent / 'NIKKE_Mod_Manager_v0_15_4_Classic_Integrated_Viewer_REGION_UPDATEFIX_SAFE_FULL'
          if root != new_root:
              if new_root.exists():
                  shutil.rmtree(new_root)
              root.rename(new_root)
              root = new_root
          print('APP_ROOT=', root)

          appjs = root / 'web' / 'app.js'
          js = appjs.read_text(encoding='utf-8', errors='ignore')
          appjs.with_suffix('.js.bak_v0154_region_updatefix_safe').write_text(js, encoding='utf-8')
          js = js.replace('v0.15.2', 'v0.15.4')
          js = js.replace('RegionFallback', 'RegionUpdateFixSafe')
          js = js.replace('REGIONFALLBACK', 'REGION_UPDATEFIX_SAFE')

          PATCH = r'''
          // --- NMM v0.15.4 Region updateRegion SAFE patch ---------------------
          (function(){
            if (window.__NMM_V0154_REGION_UPDATEFIX_SAFE__) return;
            window.__NMM_V0154_REGION_UPDATEFIX_SAFE__ = true;
            window.__NMM_REGION_UPDATEFIX_SAFE_LOG = [];
            window.__NMM_LAST_RUNTIME_STACK = window.__NMM_LAST_RUNTIME_STACK || '';

            function log(msg){
              try {
                window.__NMM_REGION_UPDATEFIX_SAFE_LOG.push(String(msg));
                if (window.__NMM_REGION_UPDATEFIX_SAFE_LOG.length > 120) window.__NMM_REGION_UPDATEFIX_SAFE_LOG.shift();
              } catch(e) {}
            }
            function clean(v){
              if (v === null || v === undefined) return '';
              v = String(v);
              if (v === 'null' || v === 'undefined' || v === '[object Object]') return '';
              return v.trim();
            }
            function posnum(v, d){
              var n = Number(v);
              return isFinite(n) && n > 0 ? n : d;
            }
            function seqTrim(s){
              s = clean(s);
              return s.replace(/0{8,}\d{1,5}$/,'').replace(/\d{16,}$/,'').replace(/_?\d{8,}$/,'');
            }
            function variants(){
              var out = [];
              for (var i=0;i<arguments.length;i++) {
                var s = clean(arguments[i]);
                if (!s) continue;
                out.push(s, seqTrim(s));
                if (s.indexOf('/') >= 0) out.push(s.split('/').pop());
                if (s.indexOf('\\') >= 0) out.push(s.split('\\').pop());
                if (s.indexOf('.') >= 0) out.push(s.replace(/\.[^.]+$/,''));
              }
              out.push('body_t','body','head_t','face_t','hair_t','weapon_t','effect_t','c015_aim_00');
              var seen = Object.create(null), u=[];
              out.forEach(function(x){ x=clean(x); if(x && !seen[x]){ seen[x]=1; u.push(x); } });
              return u;
            }
            function nsList(){
              var list = [window.pixi_spine, window.spine, window.spine38, window.spine41, window.PIXI && window.PIXI.spine];
              return list.filter(function(x, i, a){ return x && a.indexOf(x) === i; });
            }
            function atlasRegions(atlas){
              var arr=[];
              try {
                if (atlas && Array.isArray(atlas.regions)) arr = arr.concat(atlas.regions);
                if (atlas) Object.keys(atlas).forEach(function(k){
                  var v = atlas[k];
                  if (Array.isArray(v)) v.forEach(function(r){ if(r && typeof r === 'object' && (r.name || r.texture || r.page || r.rendererObject)) arr.push(r); });
                });
              } catch(e) {}
              var seen=[], out=[];
              arr.forEach(function(r){ if(r && seen.indexOf(r)<0){ seen.push(r); out.push(r); } });
              return out;
            }
            function baseTextureOf(r){
              try {
                if (!r) return null;
                if (r.texture && r.texture.baseTexture) return r.texture.baseTexture;
                if (r.baseTexture) return r.baseTexture;
                if (r.rendererObject && r.rendererObject.baseTexture) return r.rendererObject.baseTexture;
                if (r.rendererObject && r.rendererObject.texture && r.rendererObject.texture.baseTexture) return r.rendererObject.texture.baseTexture;
                var p = r.page || r._page;
                if (p) {
                  if (p.baseTexture) return p.baseTexture;
                  if (p.texture && p.texture.baseTexture) return p.texture.baseTexture;
                  if (p.rendererObject && p.rendererObject.baseTexture) return p.rendererObject.baseTexture;
                  if (p.rendererObject && p.rendererObject.texture && p.rendererObject.texture.baseTexture) return p.rendererObject.texture.baseTexture;
                }
              } catch(e) {}
              return null;
            }
            function rawUpdateRegion(r){
              if (!r || typeof r !== 'object') return r;
              try {
                if (!clean(r.name)) r.name = 'body_t';
                if (!clean(r.path)) r.path = r.name;
                if (!r.rendererObject && r.texture) r.rendererObject = r.texture;

                if (window.PIXI && window.PIXI.Texture && window.PIXI.Rectangle && (!r.texture || !r.texture.baseTexture)) {
                  var base = baseTextureOf(r);
                  if (base) {
                    var x = Number(r.x != null ? r.x : (r.left != null ? r.left : 0));
                    var y = Number(r.y != null ? r.y : (r.top != null ? r.top : 0));
                    if (!isFinite(x)) x = 0; if (!isFinite(y)) y = 0;
                    var w = posnum(r.width != null ? r.width : (r.w != null ? r.w : (r.originalWidth || r.origWidth)), 1);
                    var h = posnum(r.height != null ? r.height : (r.h != null ? r.h : (r.originalHeight || r.origHeight)), 1);
                    var rect = new window.PIXI.Rectangle(x, y, Math.max(1,w), Math.max(1,h));
                    var orig = new window.PIXI.Rectangle(0, 0, Math.max(1,w), Math.max(1,h));
                    try { r.texture = new window.PIXI.Texture(base, rect, orig, null, !!r.rotate); }
                    catch(e1) { try { r.texture = new window.PIXI.Texture(base, rect); } catch(e2) {} }
                    if (!r.rendererObject && r.texture) r.rendererObject = r.texture;
                  }
                }
                if (r.texture) {
                  try { if (typeof r.texture.updateUvs === 'function') r.texture.updateUvs(); } catch(e) {}
                  try { if (typeof r.texture._updateUvs === 'function') r.texture._updateUvs(); } catch(e) {}
                }
              } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} }
              return r;
            }
            function repairRegion(r){
              if (!r || typeof r !== 'object') return r;
              try {
                r.updateRegion = function(){ return rawUpdateRegion(this); };
                rawUpdateRegion(r);
              } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} }
              return r;
            }
            function firstRegion(atlas){
              var rs = atlasRegions(atlas);
              for (var i=0;i<rs.length;i++) if (rs[i] && clean(rs[i].name) && clean(rs[i].name).indexOf('__') !== 0) return repairRegion(rs[i]);
              return repairRegion(rs[0] || null);
            }
            function looseRegion(atlas){
              var cand = variants.apply(null, Array.prototype.slice.call(arguments,1));
              var rs = atlasRegions(atlas);
              for (var c=0;c<cand.length;c++) {
                var want = cand[c].toLowerCase(), wantT = seqTrim(cand[c]).toLowerCase();
                for (var i=0;i<rs.length;i++) {
                  var rn = clean(rs[i] && rs[i].name), rt = seqTrim(rn);
                  if (rn && (rn.toLowerCase() === want || rt.toLowerCase() === wantT)) return repairRegion(rs[i]);
                }
              }
              return null;
            }
            function safeName(name, path, seq, region){
              return clean(name) || clean(path) || clean(seq && (seq.name || seq.basePath || seq.path || seq.prefix)) || clean(region && region.name) || '__nmm_attachment_auto';
            }
            function safePath(name, path, seq, region){
              return clean(path) || clean(name) || clean(seq && (seq.name || seq.basePath || seq.path || seq.prefix)) || clean(region && region.name) || 'body_t';
            }
            function regionFor(atlas, name, path, seq){
              var seqName = seq && (seq.name || seq.basePath || seq.path || seq.prefix);
              var r = looseRegion(atlas, path, name, seqName) || firstRegion(atlas);
              repairRegion(r);
              log('regionFor name=' + clean(name) + ' path=' + clean(path) + ' seq=' + clean(seqName) + ' => ' + clean(r && r.name) + '; update=' + (r && typeof r.updateRegion) + '; tex=' + !!(r && r.texture));
              return r;
            }
            function patchAtlas(ns){
              if (!ns) return;
              try {
                if (ns.TextureAtlasRegion && ns.TextureAtlasRegion.prototype) {
                  ns.TextureAtlasRegion.prototype.updateRegion = function(){ return rawUpdateRegion(this); };
                }
              } catch(e) {}
              try {
                if (ns.TextureAtlas && ns.TextureAtlas.prototype && !ns.TextureAtlas.prototype.__nmm_v0154_findRegion) {
                  var old = ns.TextureAtlas.prototype.findRegion;
                  ns.TextureAtlas.prototype.findRegion = function(name){
                    try {
                      var cands = variants(name);
                      for (var i=0;i<cands.length;i++) {
                        var r = null;
                        try { if (old) r = old.call(this, cands[i]); } catch(e) {}
                        if (!r) r = looseRegion(this, cands[i]);
                        if (r) return repairRegion(r);
                      }
                      return firstRegion(this);
                    } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} return firstRegion(this); }
                  };
                  ns.TextureAtlas.prototype.__nmm_v0154_findRegion = true;
                }
              } catch(e) {}
            }
            function patchLoader(ns){
              if (!ns || !ns.AtlasAttachmentLoader || !ns.AtlasAttachmentLoader.prototype) return;
              var L = ns.AtlasAttachmentLoader.prototype;
              if (L.__nmm_v0154_loader) return;
              function atlasOf(loader){ return loader.atlas || loader.textureAtlas || loader._atlas || loader._textureAtlas; }
              L.newRegionAttachment = function(skin, name, path, seq){
                var region = regionFor(atlasOf(this), name, path, seq);
                var finalName = safeName(name, path, seq, region);
                var finalPath = safePath(name, path, seq, region);
                var a = ns.RegionAttachment ? new ns.RegionAttachment(finalName) : {name: finalName, type: 0};
                a.name = a.name || finalName; a.path = finalPath; a.region = repairRegion(region);
                if (seq) a.sequence = seq;
                if (region && typeof a.setRegion === 'function') { try { a.setRegion(repairRegion(region)); } catch(e) { log('region setRegion swallowed: ' + (e.message || e)); } }
                return a;
              };
              L.newMeshAttachment = function(skin, name, path, seq){
                var region = regionFor(atlasOf(this), name, path, seq);
                var finalName = safeName(name, path, seq, region);
                var finalPath = safePath(name, path, seq, region);
                var a = ns.MeshAttachment ? new ns.MeshAttachment(finalName) : {name: finalName, type: 1};
                a.name = a.name || finalName; a.path = finalPath; a.region = repairRegion(region);
                if (seq) a.sequence = seq;
                if (region && typeof a.setRegion === 'function') { try { a.setRegion(repairRegion(region)); } catch(e) { log('mesh setRegion swallowed: ' + (e.message || e)); } }
                return a;
              };
              L.__nmm_v0154_loader = true;
            }
            function patchAll(){
              try { nsList().forEach(function(ns){ patchAtlas(ns); patchLoader(ns); }); } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} }
            }
            patchAll();
            var n = 0, timer = setInterval(function(){ patchAll(); if(++n > 500) clearInterval(timer); }, 40);

            var oldDiag = window.__nmmRuntimeDiagnostic;
            window.__nmmRuntimeDiagnostic = function(){
              var s = oldDiag ? oldDiag() : 'NMM RUNTIME DIAGNOSTIC v0.15.4';
              try { s = s.replace(/v0\.15\.2/g, 'v0.15.4').replace(/v0\.15\.3/g, 'v0.15.4'); } catch(e) {}
              try { s += '\nREGION_UPDATEFIX_SAFE_LOG=' + window.__NMM_REGION_UPDATEFIX_SAFE_LOG.join(' || '); } catch(e) {}
              return s;
            };
          })();
          // --- end NMM v0.15.4 ----------------------------------------------
          '''

          if 'NMM v0.15.4 Region updateRegion SAFE patch' not in js:
              js += '\n' + PATCH + '\n'
          appjs.write_text(js, encoding='utf-8')

          for rel in ['VERSION.txt', 'LEEME_PRIMERO.txt', 'DIAGNOSTICO_RUNTIME.md']:
              p = root / rel
              old = p.read_text(encoding='utf-8', errors='ignore') if p.exists() else ''
              p.write_text('NIKKE Mod Manager v0.15.4 Classic Integrated Viewer RegionUpdateFixSafe FULL\n\n'
                           'Agrega updateRegion seguro a TextureAtlasRegion y repara regiones antes de setRegion.\n\n' + old,
                           encoding='utf-8')

          assert 'NMM v0.15.4 Region updateRegion SAFE patch' in appjs.read_text(encoding='utf-8', errors='ignore')
          compile((root / 'src' / 'preview.py').read_text(encoding='utf-8', errors='ignore'), str(root / 'src' / 'preview.py'), 'exec')
          print('OK v0.15.4 safe region updateRegion patch applied')
          PY

      - name: Zip artifact
        shell: bash
        run: |
          set -euo pipefail
          cd extracted
          zip -qr "../${OUT_NAME}.zip" .
          cd ..
          unzip -t "${OUT_NAME}.zip" >/dev/null
          ls -lh "${OUT_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_15_4_Classic_Integrated_Viewer_REGION_UPDATEFIX_SAFE_FULL
          path: NIKKE_Mod_Manager_v0_15_4_Classic_Integrated_Viewer_REGION_UPDATEFIX_SAFE_FULL.zip
          if-no-files-found: error
