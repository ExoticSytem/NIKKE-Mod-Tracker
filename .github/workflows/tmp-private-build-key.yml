name: Temporary private EXE build key

on:
  push:
    paths:
      - '.tmp-build/key-trigger.txt'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ephemeral RSA key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out private.pem
          openssl rsa -pubout -in private.pem -out public.pem
          echo "PUBLIC_KEY_B64=$(base64 -w0 public.pem)"
      - name: Store private key temporarily
        uses: actions/upload-artifact@v4
        with:
          name: nmm-private-build-key
          path: private.pem
          retention-days: 1
          if-no-files-found: error
