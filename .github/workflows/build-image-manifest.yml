name: Build character image manifest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'assets/characters/manual/**'
      - 'assets/characters/library/**'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          root = Path('assets/characters')
          images = {}
          allowed = {'.png', '.webp', '.jpg', '.jpeg'}
          for folder in ('manual', 'library'):
              d = root / folder
              if not d.exists():
                  continue
              for p in sorted(d.iterdir()):
                  if not p.is_file() or p.suffix.lower() not in allowed:
                      continue
                  stem = p.stem
                  if not stem.startswith('c') or '_' not in stem:
                      continue
                  key = stem[1:]
                  images.setdefault(key, []).append(str(p).replace('\\', '/'))

          # manual overrides must always be first
          for key, paths in images.items():
              paths.sort(key=lambda x: (0 if '/manual/' in x else 1, x))

          payload = {
              'version': 1,
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'images': images,
          }
          (root / 'manifest.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit manifest if changed
        shell: bash
        run: |
          if git diff --quiet -- assets/characters/manifest.json; then
            echo 'Manifest unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/manifest.json
          git commit -m 'Update character image manifest'
          git push
