name: Build v0.15.3 RegionUpdateFix from v0.15.2 Artifact

on:
  push:
    paths:
      - '.github/workflows/build-v0153-region-updatefix-from-v0152-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0153-region-updatefix:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_ID: '10040876556'
      OUT_NAME: 'NIKKE_Mod_Manager_v0_15_3_Classic_Integrated_Viewer_REGION_UPDATEFIX_FULL'
    steps:
      - name: Download v0.15.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o artifact.zip
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          appzip="$(find artifact -type f -name '*.zip' | head -n 1 || true)"
          if [ -n "$appzip" ]; then
            unzip -q "$appzip" -d extracted
          else
            cp -R artifact/* extracted/ || true
          fi
          find extracted -maxdepth 3 -type f | sed -n '1,80p'

      - name: Apply v0.15.3 region.updateRegion fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          roots = [p.parent.parent for p in Path('extracted').rglob('web/app.js')]
          if not roots:
              raise SystemExit('No web/app.js found')
          root = roots[0]
          new_root = root.parent / 'NIKKE_Mod_Manager_v0_15_3_Classic_Integrated_Viewer_REGION_UPDATEFIX_FULL'
          if root != new_root:
              if new_root.exists():
                  shutil.rmtree(new_root)
              root.rename(new_root)
              root = new_root
          print('APP_ROOT=', root)

          appjs = root / 'web' / 'app.js'
          js = appjs.read_text(encoding='utf-8', errors='ignore')
          appjs.with_suffix('.js.bak_v0153_region_updatefix').write_text(js, encoding='utf-8')
          js = js.replace('v0.15.2', 'v0.15.3')
          js = js.replace('RegionFallback', 'RegionUpdateFix')
          js = js.replace('REGIONFALLBACK', 'REGION_UPDATEFIX')

          PATCH = r'''
          // --- NMM v0.15.3 Region updateRegion repair patch -------------------
          (function(){
            if (window.__NMM_V0153_REGION_UPDATEFIX__) return;
            window.__NMM_V0153_REGION_UPDATEFIX__ = true;
            window.__NMM_REGION_UPDATEFIX_LOG = [];
            window.__NMM_LAST_RUNTIME_STACK = window.__NMM_LAST_RUNTIME_STACK || '';

            function log(msg){
              try {
                window.__NMM_REGION_UPDATEFIX_LOG.push(String(msg));
                if (window.__NMM_REGION_UPDATEFIX_LOG.length > 80) window.__NMM_REGION_UPDATEFIX_LOG.shift();
              } catch(e) {}
            }
            function clean(v){
              if (v === null || v === undefined) return '';
              v = String(v);
              if (v === 'null' || v === 'undefined' || v === '[object Object]') return '';
              return v.trim();
            }
            function num(v, d){
              var n = Number(v);
              return isFinite(n) && n > 0 ? n : d;
            }
            function variants(){
              var out = [];
              for (var i=0;i<arguments.length;i++) {
                var s = clean(arguments[i]);
                if (!s) continue;
                out.push(s);
                out.push(s.replace(/0{8,}\d{1,5}$/,''));
                out.push(s.replace(/\d{16,}$/,''));
                out.push(s.replace(/_?\d{8,}$/,''));
                if (s.indexOf('/') >= 0) out.push(s.split('/').pop());
                if (s.indexOf('\\') >= 0) out.push(s.split('\\').pop());
                if (s.indexOf('.') >= 0) out.push(s.replace(/\.[^.]+$/,''));
              }
              out.push('body_t','body','head_t','face_t','hair_t','weapon_t','effect_t','c015_aim_00');
              var seen = Object.create(null), u=[];
              out.forEach(function(x){ x=clean(x); if(x && !seen[x]){seen[x]=1;u.push(x);} });
              return u;
            }
            function nsList(){
              return [window.pixi_spine, window.spine, window.spine38, window.spine41, window.PIXI && window.PIXI.spine]
                .filter(function(x, i, a){ return x && a.indexOf(x) === i; });
            }
            function regionsFromAtlas(atlas){
              var arr=[];
              try {
                if (atlas && Array.isArray(atlas.regions)) arr = arr.concat(atlas.regions);
                if (atlas) Object.keys(atlas).forEach(function(k){
                  var v = atlas[k];
                  if (Array.isArray(v)) v.forEach(function(r){ if(r && typeof r === 'object' && (r.name || r.texture || r.page)) arr.push(r); });
                });
              } catch(e) {}
              var seen=[], out=[];
              arr.forEach(function(r){ if(r && seen.indexOf(r)<0){ seen.push(r); out.push(r); } });
              return out;
            }
            function firstRegion(atlas){
              var rs=regionsFromAtlas(atlas);
              for(var i=0;i<rs.length;i++) if(rs[i] && clean(rs[i].name) && clean(rs[i].name).indexOf('__')!==0) return repairRegion(rs[i]);
              return repairRegion(rs[0] || null);
            }
            function findLoose(atlas){
              var cand = variants.apply(null, Array.prototype.slice.call(arguments,1));
              var rs = regionsFromAtlas(atlas);
              for(var c=0;c<cand.length;c++){
                var want = cand[c].toLowerCase();
                var wantTrim = cand[c].replace(/0{8,}\d{1,5}$/,'').replace(/\d{16,}$/,'').replace(/_?\d{8,}$/,'').toLowerCase();
                for(var i=0;i<rs.length;i++){
                  var rn = clean(rs[i] && rs[i].name);
                  var rt = rn.replace(/0{8,}\d{1,5}$/,'').replace(/\d{16,}$/,'').replace(/_?\d{8,}$/,'');
                  if(rn && (rn.toLowerCase()===want || rt.toLowerCase()===wantTrim)) return repairRegion(rs[i]);
                }
              }
              return null;
            }
            function getBaseTexture(r){
              try {
                if (!r) return null;
                if (r.texture && r.texture.baseTexture) return r.texture.baseTexture;
                if (r.baseTexture) return r.baseTexture;
                var p = r.page || r._page;
                if (p) {
                  if (p.baseTexture) return p.baseTexture;
                  if (p.texture && p.texture.baseTexture) return p.texture.baseTexture;
                  if (p.rendererObject && p.rendererObject.baseTexture) return p.rendererObject.baseTexture;
                }
              } catch(e) {}
              return null;
            }
            function makeTextureForRegion(r){
              try {
                if (!r || !window.PIXI || !window.PIXI.Texture || !window.PIXI.Rectangle) return null;
                if (r.texture && (r.texture.baseTexture || r.texture.valid !== undefined || r.texture.frame)) return r.texture;
                var base = getBaseTexture(r);
                if (!base) return r.texture || null;
                var x = Number(r.x != null ? r.x : (r.left != null ? r.left : 0));
                var y = Number(r.y != null ? r.y : (r.top != null ? r.top : 0));
                var w = num(r.width != null ? r.width : (r.w != null ? r.w : (r.originalWidth || r.origWidth)), 1);
                var h = num(r.height != null ? r.height : (r.h != null ? r.h : (r.originalHeight || r.origHeight)), 1);
                if (!isFinite(x)) x = 0; if (!isFinite(y)) y = 0;
                var rect = new window.PIXI.Rectangle(x, y, Math.max(1,w), Math.max(1,h));
                var orig = new window.PIXI.Rectangle(0, 0, Math.max(1,w), Math.max(1,h));
                try { r.texture = new window.PIXI.Texture(base, rect, orig, null, !!r.rotate); }
                catch(e1) { try { r.texture = new window.PIXI.Texture(base, rect); } catch(e2) {} }
                return r.texture || null;
              } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} return null; }
            }
            function repairRegion(r){
              if (!r || typeof r !== 'object') return r;
              try {
                if (!clean(r.name)) r.name = 'body_t';
                if (!r.path) r.path = r.name;
                if (!r.rendererObject && r.texture) r.rendererObject = r.texture;
                makeTextureForRegion(r);
                if (typeof r.updateRegion !== 'function') {
                  r.updateRegion = function(){
                    try {
                      makeTextureForRegion(this);
                      if (this.texture && typeof this.texture.updateUvs === 'function') this.texture.updateUvs();
                      if (this.texture && typeof this.texture._updateUvs === 'function') this.texture._updateUvs();
                      if (!this.rendererObject && this.texture) this.rendererObject = this.texture;
                    } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} }
                    return this;
                  };
                }
                try { r.updateRegion(); } catch(e) {}
              } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} }
              return r;
            }
            function safeName(name, path, sequence, region){
              return clean(name) || clean(path) || clean(sequence && (sequence.name || sequence.basePath || sequence.path || sequence.prefix)) || clean(region && region.name) || '__nmm_attachment_auto';
            }
            function safePath(name, path, sequence, region){
              return clean(path) || clean(name) || clean(sequence && (sequence.name || sequence.basePath || sequence.path || sequence.prefix)) || clean(region && region.name) || 'body_t';
            }
            function regionFor(atlas, name, path, sequence){
              var seqName = sequence && (sequence.name || sequence.basePath || sequence.path || sequence.prefix);
              var r = findLoose(atlas, path, name, seqName) || firstRegion(atlas);
              repairRegion(r);
              log('regionFor name=' + clean(name) + ' path=' + clean(path) + ' seq=' + clean(seqName) + ' => ' + clean(r && r.name) + ' update=' + (r && typeof r.updateRegion));
              return r;
            }
            function patchAtlas(ns){
              if (!ns) return;
              try {
                if (ns.TextureAtlasRegion && ns.TextureAtlasRegion.prototype && typeof ns.TextureAtlasRegion.prototype.updateRegion !== 'function') {
                  ns.TextureAtlasRegion.prototype.updateRegion = function(){ repairRegion(this); return this; };
                }
              } catch(e) {}
              try {
                if (ns.TextureAtlas && ns.TextureAtlas.prototype && !ns.TextureAtlas.prototype.__nmm_v0153_findRegion) {
                  var old = ns.TextureAtlas.prototype.findRegion;
                  ns.TextureAtlas.prototype.findRegion = function(name){
                    try {
                      var cands = variants(name);
                      for (var i=0;i<cands.length;i++) {
                        var r = null;
                        try { if (old) r = old.call(this, cands[i]); } catch(e) {}
                        if (!r) r = findLoose(this, cands[i]);
                        if (r) return repairRegion(r);
                      }
                      return firstRegion(this);
                    } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} return firstRegion(this); }
                  };
                  ns.TextureAtlas.prototype.__nmm_v0153_findRegion = true;
                }
              } catch(e) {}
            }
            function patchLoader(ns){
              if (!ns || !ns.AtlasAttachmentLoader || !ns.AtlasAttachmentLoader.prototype) return;
              var L = ns.AtlasAttachmentLoader.prototype;
              if (L.__nmm_v0153_loader) return;
              function atlasOf(loader){ return loader.atlas || loader.textureAtlas || loader._atlas || loader._textureAtlas; }
              L.newRegionAttachment = function(skin, name, path, sequence){
                var region = regionFor(atlasOf(this), name, path, sequence);
                var finalName = safeName(name, path, sequence, region);
                var finalPath = safePath(name, path, sequence, region);
                var a = ns.RegionAttachment ? new ns.RegionAttachment(finalName) : {name: finalName, type: 0};
                a.name = a.name || finalName;
                a.path = finalPath;
                a.region = repairRegion(region);
                if (sequence) a.sequence = sequence;
                if (typeof a.setRegion === 'function' && region) { try { a.setRegion(repairRegion(region)); } catch(e) { log('setRegion region attach swallowed: '+(e.message||e)); } }
                if (typeof a.updateRegion === 'function') { try { a.updateRegion(); } catch(e) {} }
                return a;
              };
              L.newMeshAttachment = function(skin, name, path, sequence){
                var region = regionFor(atlasOf(this), name, path, sequence);
                var finalName = safeName(name, path, sequence, region);
                var finalPath = safePath(name, path, sequence, region);
                var a = ns.MeshAttachment ? new ns.MeshAttachment(finalName) : {name: finalName, type: 1};
                a.name = a.name || finalName;
                a.path = finalPath;
                a.region = repairRegion(region);
                if (sequence) a.sequence = sequence;
                if (typeof a.setRegion === 'function' && region) { try { a.setRegion(repairRegion(region)); } catch(e) { log('setRegion mesh attach swallowed: '+(e.message||e)); } }
                if (typeof a.updateRegion === 'function') { try { a.updateRegion(); } catch(e) {} }
                return a;
              };
              L.__nmm_v0153_loader = true;
            }
            function patchAll(){
              try { nsList().forEach(function(ns){ patchAtlas(ns); patchLoader(ns); }); } catch(e) { try { window.__NMM_LAST_RUNTIME_STACK = e.stack || String(e); } catch(_){} }
            }
            patchAll();
            var n=0, t=setInterval(function(){ patchAll(); if(++n>500) clearInterval(t); }, 40);

            var oldDiag = window.__nmmRuntimeDiagnostic;
            window.__nmmRuntimeDiagnostic = function(){
              var s = oldDiag ? oldDiag() : 'NMM RUNTIME DIAGNOSTIC v0.15.3';
              try { s = s.replace(/v0\.15\.2/g, 'v0.15.3'); } catch(e) {}
              try { s += '\nREGION_UPDATEFIX_LOG=' + window.__NMM_REGION_UPDATEFIX_LOG.join(' || '); } catch(e) {}
              return s;
            };
          })();
          // --- end NMM v0.15.3 ----------------------------------------------
          '''

          if 'NMM v0.15.3 Region updateRegion repair patch' not in js:
              js += '\n' + PATCH + '\n'
          appjs.write_text(js, encoding='utf-8')

          # Update metadata files.
          for rel in ['VERSION.txt', 'LEEME_PRIMERO.txt', 'DIAGNOSTICO_RUNTIME.md']:
              p = root / rel
              old = p.read_text(encoding='utf-8', errors='ignore') if p.exists() else ''
              p.write_text('NIKKE Mod Manager v0.15.3 Classic Integrated Viewer RegionUpdateFix FULL\n\n'
                           'Parchea TextureAtlasRegion/atlas region fallback para evitar region.updateRegion is not a function.\n\n' + old,
                           encoding='utf-8')

          # Validate.
          assert 'NMM v0.15.3 Region updateRegion repair patch' in appjs.read_text(encoding='utf-8', errors='ignore')
          compile((root / 'src' / 'preview.py').read_text(encoding='utf-8', errors='ignore'), str(root / 'src' / 'preview.py'), 'exec')
          print('OK v0.15.3 region updateRegion patch applied')
          PY

      - name: Zip artifact
        shell: bash
        run: |
          set -euo pipefail
          cd extracted
          zip -qr "../${OUT_NAME}.zip" .
          cd ..
          unzip -t "${OUT_NAME}.zip" >/dev/null
          ls -lh "${OUT_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_15_3_Classic_Integrated_Viewer_REGION_UPDATEFIX_FULL
          path: NIKKE_Mod_Manager_v0_15_3_Classic_Integrated_Viewer_REGION_UPDATEFIX_FULL.zip
          if-no-files-found: error
