name: Recover legacy v0.11 source

on:
  push:
    branches:
      - recover-v011-source
    paths:
      - '.github/workflows/recover-v011-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf legacy_v011_recovered
          mkdir -p legacy_v011_recovered
          cat source.part* | tr -d '\r\n\t ' > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          file /tmp/source.zip | tee legacy_v011_recovered/RECOVERY_REPORT.txt
          sha256sum /tmp/source.zip | tee -a legacy_v011_recovered/RECOVERY_REPORT.txt
          echo >> legacy_v011_recovered/RECOVERY_REPORT.txt
          echo '=== ZIP TEST ===' >> legacy_v011_recovered/RECOVERY_REPORT.txt
          unzip -t /tmp/source.zip | tee -a legacy_v011_recovered/RECOVERY_REPORT.txt
          echo >> legacy_v011_recovered/RECOVERY_REPORT.txt
          echo '=== ZIP CONTENTS ===' >> legacy_v011_recovered/RECOVERY_REPORT.txt
          unzip -l /tmp/source.zip | tee -a legacy_v011_recovered/RECOVERY_REPORT.txt

      - name: Extract recovered source
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/source.zip -d legacy_v011_recovered/source
          echo >> legacy_v011_recovered/RECOVERY_REPORT.txt
          echo '=== EXTRACTED FILES ===' >> legacy_v011_recovered/RECOVERY_REPORT.txt
          find legacy_v011_recovered/source -type f -printf '%p\n' | sort | tee -a legacy_v011_recovered/RECOVERY_REPORT.txt

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy_v011_recovered
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit'
          else
            git commit -m 'Recover legacy v0.11 source archive'
            git push
          fi
