name: Build PC Preview v0.12 FULL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pc_full_v012/**'
      - 'pc_preview_v012/preview_beta_server.py'
      - 'catalog/base_catalog.json'
      - '.github/workflows/build-pc-preview-v012-full.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow cryptography send2trash

      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile pc_full_v012/manager.py
          python -m py_compile pc_preview_v012/preview_beta_server.py

      - name: Prepare native desktop package
        shell: pwsh
        run: |
          $root = 'output/NIKKE_Mod_Manager_v0_12_Preview_Beta'
          New-Item -ItemType Directory -Force "$root/tools" | Out-Null
          New-Item -ItemType Directory -Force "$root/catalog" | Out-Null
          New-Item -ItemType Directory -Force "$root/data" | Out-Null
          Copy-Item pc_full_v012/manager.py "$root/manager.py"
          Copy-Item pc_full_v012/INSTALAR_Y_ABRIR.bat "$root/INSTALAR_Y_ABRIR.bat"
          Copy-Item pc_full_v012/README.txt "$root/README.txt"
          Copy-Item pc_preview_v012/preview_beta_server.py "$root/tools/preview_beta_server.py"
          Copy-Item catalog/base_catalog.json "$root/catalog/base_catalog.json"
          'NIKKE Mod Manager v0.12 Preview Beta FULL - Native Desktop' | Set-Content -Encoding UTF8 "$root/VERSION.txt"

      - name: Validate bundled catalog and manager module
        shell: pwsh
        run: |
          @'
          import importlib.util, json, pathlib
          root = pathlib.Path('output/NIKKE_Mod_Manager_v0_12_Preview_Beta')
          catalog = json.loads((root/'catalog'/'base_catalog.json').read_text(encoding='utf-8'))
          chars = catalog.get('characters', [])
          assert len(chars) >= 500, f'Catalog too small: {len(chars)}'
          spec = importlib.util.spec_from_file_location('manager', root/'manager.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, 'App')
          assert mod.APP_VERSION.startswith('0.12')
          print('Native manager module + catalog OK')
          '@ | Set-Content -Encoding UTF8 test_manager_native.py
          python test_manager_native.py

      - name: Smoke test preview API
        shell: pwsh
        run: |
          $root = Resolve-Path output/NIKKE_Mod_Manager_v0_12_Preview_Beta
          $p = Start-Process python -ArgumentList "$root/tools/preview_beta_server.py",'--root',"$root",'--port','8137' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8137/health
          if ($r.StatusCode -ne 200) { throw 'Preview health check failed' }
          Stop-Process -Id $p.Id -Force

      - name: Test 3DMigoto detection helper
        shell: pwsh
        run: |
          @'
          import importlib.util, pathlib, tempfile
          p = pathlib.Path('pc_preview_v012/preview_beta_server.py')
          spec = importlib.util.spec_from_file_location('pb', p)
          pb = importlib.util.module_from_spec(spec); spec.loader.exec_module(pb)
          with tempfile.TemporaryDirectory() as d:
              root = pathlib.Path(d) / 'c043_02_cover_Test-3DMigoto'
              root.mkdir()
              (root / 'mod.ini').write_text('[TextureOverrideBody]\nhash=123\nvb0 = ResourceBody\n', encoding='utf-8')
              assert pb.is_3dmigoto(root)
              info = pb.parse_mod_name(root)
              assert info['id'] == '043' and info['ver'] == '02' and info['action'].lower() == 'cover'
          print('3DMigoto helper test OK')
          '@ | Set-Content -Encoding UTF8 test_preview_full.py
          python test_preview_full.py

      - name: Verify package layout
        shell: pwsh
        run: |
          $root = 'output/NIKKE_Mod_Manager_v0_12_Preview_Beta'
          $required = @(
            "$root/INSTALAR_Y_ABRIR.bat",
            "$root/manager.py",
            "$root/tools/preview_beta_server.py",
            "$root/catalog/base_catalog.json",
            "$root/README.txt"
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing $f" } }
          if (Test-Path "$root/manager_server.py") { throw 'Web manager must not be packaged as the main app' }
          Write-Host 'Native standalone package OK'

      - name: Upload full standalone package
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Mod-Manager-v0.12-Preview-Beta-FULL-NATIVE
          path: output/NIKKE_Mod_Manager_v0_12_Preview_Beta
          if-no-files-found: error
          retention-days: 30
