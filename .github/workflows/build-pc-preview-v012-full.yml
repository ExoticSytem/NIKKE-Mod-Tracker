name: Build PC Preview v0.12 FULL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pc_full_v012/**'
      - 'pc_preview_v012/preview_beta_server.py'
      - 'catalog/base_catalog.json'
      - '.github/workflows/build-pc-preview-v012-full.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview dependencies
        run: python -m pip install --disable-pip-version-check UnityPy Pillow cryptography

      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile pc_full_v012/manager_server.py
          python -m py_compile pc_preview_v012/preview_beta_server.py

      - name: Prepare standalone folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/NIKKE_Mod_Manager_v0_12_Preview_Beta | Out-Null
          New-Item -ItemType Directory -Force output/NIKKE_Mod_Manager_v0_12_Preview_Beta/tools | Out-Null
          New-Item -ItemType Directory -Force output/NIKKE_Mod_Manager_v0_12_Preview_Beta/catalog | Out-Null
          New-Item -ItemType Directory -Force output/NIKKE_Mod_Manager_v0_12_Preview_Beta/data | Out-Null
          Copy-Item pc_full_v012/manager_server.py output/NIKKE_Mod_Manager_v0_12_Preview_Beta/
          Copy-Item pc_full_v012/INSTALAR_Y_ABRIR.bat output/NIKKE_Mod_Manager_v0_12_Preview_Beta/
          Copy-Item pc_full_v012/README.txt output/NIKKE_Mod_Manager_v0_12_Preview_Beta/
          Copy-Item pc_preview_v012/preview_beta_server.py output/NIKKE_Mod_Manager_v0_12_Preview_Beta/tools/
          Copy-Item catalog/base_catalog.json output/NIKKE_Mod_Manager_v0_12_Preview_Beta/catalog/
          'NIKKE Mod Manager v0.12 Preview Beta FULL' | Set-Content -Encoding UTF8 output/NIKKE_Mod_Manager_v0_12_Preview_Beta/VERSION.txt

      - name: Smoke test manager API
        shell: pwsh
        run: |
          $root = Resolve-Path output/NIKKE_Mod_Manager_v0_12_Preview_Beta
          $p = Start-Process python -ArgumentList "$root/manager_server.py",'--no-browser','--port','8136' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8136/api/health
          if ($r.StatusCode -ne 200) { throw 'Manager health check failed' }
          $inv = Invoke-RestMethod http://127.0.0.1:8136/api/inventory
          if ($null -eq $inv.characters -or $inv.characters.Count -lt 500) { throw 'Bundled catalog did not load' }
          Stop-Process -Id $p.Id -Force

      - name: Smoke test preview API
        shell: pwsh
        run: |
          $root = Resolve-Path output/NIKKE_Mod_Manager_v0_12_Preview_Beta
          $p = Start-Process python -ArgumentList "$root/tools/preview_beta_server.py",'--root',"$root",'--port','8137' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8137/health
          if ($r.StatusCode -ne 200) { throw 'Preview health check failed' }
          Stop-Process -Id $p.Id -Force

      - name: Test 3DMigoto detection helper
        shell: pwsh
        run: |
          @'
          import importlib.util, pathlib, tempfile
          p = pathlib.Path('pc_preview_v012/preview_beta_server.py')
          spec = importlib.util.spec_from_file_location('pb', p)
          pb = importlib.util.module_from_spec(spec); spec.loader.exec_module(pb)
          with tempfile.TemporaryDirectory() as d:
              root = pathlib.Path(d) / 'c043_02_cover_Test-3DMigoto'
              root.mkdir()
              (root / 'mod.ini').write_text('[TextureOverrideBody]\nhash=123\nvb0 = ResourceBody\n', encoding='utf-8')
              assert pb.is_3dmigoto(root)
              info = pb.parse_mod_name(root)
              assert info['id'] == '043' and info['ver'] == '02' and info['action'].lower() == 'cover'
          print('3DMigoto helper test OK')
          '@ | Set-Content -Encoding UTF8 test_preview_full.py
          python test_preview_full.py

      - name: Verify full package
        shell: pwsh
        run: |
          $root = 'output/NIKKE_Mod_Manager_v0_12_Preview_Beta'
          $required = @(
            "$root/INSTALAR_Y_ABRIR.bat",
            "$root/manager_server.py",
            "$root/tools/preview_beta_server.py",
            "$root/catalog/base_catalog.json",
            "$root/README.txt"
          )
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing $f" } }
          Write-Host 'Standalone package OK'

      - name: Upload full standalone package
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE-Mod-Manager-v0.12-Preview-Beta-FULL
          path: output/NIKKE_Mod_Manager_v0_12_Preview_Beta
          if-no-files-found: error
          retention-days: 30
