name: Temporary Cython protected Windows EXE build
on:
  push:
    branches: ['tmp/cython-protected-exe-build']
    paths: ['.tmp-build/cython-run.txt']
permissions:
  contents: read
  actions: read
jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_URL: 'https://eu-central.storage.cloudconvert.com/tasks/83a10df6-2a74-450f-90c9-f5bddc43b0e2/source2%2Csource2.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260913%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260913T042638Z&X-Amz-Expires=86400&X-Amz-Signature=83bb0d8dc48640483356cc7eeaa3dac328373a31f003a54adfba24aa8a145c23&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22source2%2Csource2.zip%22&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject'
    steps:
      - name: Download encrypted payload
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile transfer.zip
          Expand-Archive transfer.zip encrypted -Force
      - name: Download build key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $p = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=nmm-private-build-key&per_page=10"
          $a = $p.artifacts | Where-Object {-not $_.expired} | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $a) { throw 'Build key not found' }
          Invoke-WebRequest -Headers $h -Uri $a.archive_download_url -OutFile key.zip
          Expand-Archive key.zip key -Force
      - name: Decrypt source
        shell: pwsh
        run: |
          $o = 'C:\Program Files\Git\usr\bin\openssl.exe'
          & $o pkeyutl -decrypt -inkey key/private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in encrypted/source2.key -out keyiv.bin
          if ($LASTEXITCODE -ne 0) { throw 'RSA decrypt failed' }
          $b = [IO.File]::ReadAllBytes((Resolve-Path keyiv.bin))
          if ($b.Length -ne 48) { throw 'Bad key length' }
          $k = -join ($b[0..31] | ForEach-Object {$_.ToString('x2')})
          $iv = -join ($b[32..47] | ForEach-Object {$_.ToString('x2')})
          & $o enc -d -aes-256-cbc -K $k -iv $iv -in encrypted/source2.enc -out source.zip
          if ($LASTEXITCODE -ne 0) { throw 'AES decrypt failed' }
          Expand-Archive source.zip source -Force
          if (-not (Test-Path source/app.py)) { throw 'Source incomplete' }
          if (-not (Select-String -Path source/ABOUT_PROJECT_ES_EN.txt -Pattern 'BD2ModManager' -Quiet)) { throw 'Credits missing' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cython pyinstaller setuptools wheel pefile
      - name: Discover imports used by proprietary modules
        shell: pwsh
        working-directory: source
        run: |
          @'
          import ast
          import importlib.util
          from pathlib import Path

          files = [Path('app.py')] + sorted(Path('src').glob('*.py'))
          mods = set()
          for p in files:
              tree = ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      base = None
                      if node.level:
                          if p.parent.name == 'src':
                              base = 'src' + ('.' + node.module if node.module else '')
                      elif node.module:
                          base = node.module
                      if base:
                          mods.add(base)
                          for alias in node.names:
                              if alias.name != '*':
                                  mods.add(base + '.' + alias.name)

          own = {
              'src.api','src.catalog','src.catalog_updater','src.classifier','src.playable_updater',
              'src.preview','src.repacker_detector','src.repacker_engine','src.repacker_service',
              'src.runtime_cache','src.scanner','src.sync_server'
          }
          usable = set(own)
          for mod in sorted(mods):
              try:
                  if importlib.util.find_spec(mod) is not None:
                      usable.add(mod)
              except Exception:
                  pass
          usable.update({'sqlite3', '_sqlite3', 'tkinter.filedialog', 'tkinter.messagebox', 'tkinter.ttk'})
          Path('hidden_imports.txt').write_text('\n'.join(sorted(usable)) + '\n', encoding='utf-8')
          print('HIDDEN_IMPORTS', len(usable))
          print(Path('hidden_imports.txt').read_text(encoding='utf-8'))
          '@ | Set-Content -Encoding UTF8 collect_hidden_imports.py
          python collect_hidden_imports.py
          if ($LASTEXITCODE -ne 0) { throw 'Import discovery failed' }
          foreach ($m in @('sqlite3','tkinter.filedialog','tkinter.messagebox','tkinter.ttk')) {
            if (-not (Select-String -Path hidden_imports.txt -Pattern "^$([regex]::Escape($m))$" -Quiet)) { throw "$m was not captured" }
          }
      - name: Compile proprietary modules
        shell: pwsh
        working-directory: source
        run: |
          Copy-Item app.py nmm_entry.py
          @'
          from pathlib import Path
          from setuptools import setup, Extension
          from Cython.Build import cythonize
          exts=[Extension('nmm_entry',['nmm_entry.py'])]
          for p in sorted(Path('src').glob('*.py')):
              if p.name!='__init__.py':
                  exts.append(Extension(f'src.{p.stem}',[str(p)]))
          setup(name='nmm_compiled',ext_modules=cythonize(exts,compiler_directives={'language_level':3,'binding':True,'annotation_typing':False},annotate=False))
          '@ | Set-Content -Encoding UTF8 build_cython.py
          python build_cython.py build_ext --inplace
          if ($LASTEXITCODE -ne 0) { throw 'Cython build failed' }
          if (-not (Get-ChildItem -File -Filter 'nmm_entry*.pyd')) { throw 'nmm_entry pyd missing' }
          if ((Get-ChildItem src -File -Filter '*.pyd').Count -ne 12) { throw 'Expected 12 compiled src modules' }
      - name: Smoke test compiled modules
        shell: pwsh
        working-directory: source
        run: |
          python -c "import sqlite3, tkinter.filedialog, tkinter.messagebox, tkinter.ttk; import nmm_entry; import src.api, src.catalog, src.catalog_updater, src.classifier, src.playable_updater, src.preview, src.repacker_detector, src.repacker_engine, src.repacker_service, src.runtime_cache, src.scanner, src.sync_server; print('COMPILED_IMPORTS_OK', sqlite3.sqlite_version)"
          if ($LASTEXITCODE -ne 0) { throw 'Compiled module import smoke test failed' }
      - name: Remove proprietary source
        shell: pwsh
        working-directory: source
        run: |
          Remove-Item app.py,nmm_entry.py,build_cython.py,collect_hidden_imports.py -Force
          Get-ChildItem src -File -Filter '*.py' | Where-Object {$_.Name -ne '__init__.py'} | Remove-Item -Force
          Set-Content -Encoding UTF8 src/__init__.py ''
          @'
          import traceback
          from pathlib import Path
          import nmm_entry
          try:
              nmm_entry.main()
          except Exception as exc:
              try:
                  p=Path(__file__).resolve().parent/'data'/'startup_error.log'
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(f'{type(exc).__name__}: {exc}\n\n{traceback.format_exc()}',encoding='utf-8')
              except Exception:
                  pass
              try:
                  import tkinter as tk
                  from tkinter import messagebox
                  w=tk.Tk();w.withdraw();messagebox.showerror('NIKKE Mod Manager','La aplicación no pudo iniciar. Revisa data/startup_error.log.\n\n'+str(exc));w.destroy()
              except Exception:
                  pass
              raise
          '@ | Set-Content -Encoding UTF8 launcher.py
      - name: Package standalone distribution
        shell: pwsh
        working-directory: source
        run: |
          $hidden = @(Get-Content hidden_imports.txt | Where-Object { $_.Trim() } | Sort-Object -Unique)
          $a = @('--noconfirm','--clean','--windowed','--onedir','--contents-directory','.','--name','NIKKE_Mod_Manager','--paths','.','--collect-all','webview','--collect-all','UnityPy','--collect-all','Crypto','--collect-all','qrcode','--collect-all','send2trash','--collect-all','zstandard','--collect-all','lz4','--add-data','web;web','--add-data','data;data','--add-data','Backups;Backups','--add-data','VERSION.txt;.','--add-data','ABOUT_PROJECT_ES_EN.txt;.','--add-data','LEEME_EJECUTABLE.txt;.')
          foreach ($m in $hidden) { $a += @('--hidden-import',$m) }
          $a += 'launcher.py'
          python -m PyInstaller @a
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Validate distribution
        shell: pwsh
        working-directory: source
        run: |
          $src = Resolve-Path dist/NIKKE_Mod_Manager
          $out = Join-Path (Resolve-Path dist) 'NIKKE_Mod_Manager_v0_34_9_Windows'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          Move-Item $src $out
          $exe = Join-Path $out 'NIKKE_Mod_Manager.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing' }
          $badRoot = @((Join-Path $out 'app.py'),(Join-Path $out 'nmm_entry.py')) | Where-Object { Test-Path $_ }
          $ownNames = @('api.py','catalog.py','catalog_updater.py','classifier.py','playable_updater.py','preview.py','repacker_detector.py','repacker_engine.py','repacker_service.py','runtime_cache.py','scanner.py','sync_server.py')
          $srcDir = Join-Path $out 'src'
          $badSrc = if (Test-Path $srcDir) { Get-ChildItem $srcDir -File -Filter '*.py' | Where-Object { $_.Name -in $ownNames } } else { @() }
          if ($badRoot -or $badSrc) { throw 'Proprietary Python source found in application root/src' }
          $pydNames = Get-ChildItem $srcDir -File -Filter '*.pyd' | ForEach-Object {$_.Name}
          if ($pydNames.Count -ne 12) { throw "Expected 12 compiled src PYD files; found $($pydNames.Count)" }
          if (-not (Test-Path (Join-Path $out 'nmm_entry.cp312-win_amd64.pyd'))) { throw 'Compiled entry PYD missing' }
          if (-not (Get-ChildItem $out -Recurse -File -Filter '_sqlite3*.pyd' -ErrorAction SilentlyContinue)) { throw '_sqlite3 runtime binary missing' }
          if (-not (Test-Path (Join-Path $out 'web/index.html'))) { throw 'Web UI missing' }
          if (-not (Test-Path (Join-Path $out 'data'))) { throw 'Data directory missing' }
          if (-not (Select-String -Path (Join-Path $out 'ABOUT_PROJECT_ES_EN.txt') -Pattern 'BD2ModManager' -Quiet)) { throw 'BD2 credit missing' }
          if (-not (Select-String -Path (Join-Path $out 'ABOUT_PROJECT_ES_EN.txt') -Pattern 'Na0h / NMM' -Quiet)) { throw 'NMM credit missing' }
          @('NIKKE Mod Manager v0.34.9 - Windows protected distribution','Application modules compiled with Cython; proprietary Python source is not distributed.','Runtime dependencies bundled with PyInstaller.','Repack and Viewer are experimental/testing features.','Keep the complete folder together; do not move only the EXE.') | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_INFO.txt')
          python -c "import pefile,sys; p=pefile.PE(sys.argv[1]); assert p.FILE_HEADER.Machine==0x8664, hex(p.FILE_HEADER.Machine); assert p.OPTIONAL_HEADER.Subsystem==2, p.OPTIONAL_HEADER.Subsystem; assert p.OPTIONAL_HEADER.Magic==0x20B, hex(p.OPTIONAL_HEADER.Magic); print('PE_VALID_AMD64_GUI')" $exe
          if ($LASTEXITCODE -ne 0) { throw 'PE validation failed' }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Authenticode status: $($sig.Status)"
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum | Format-List Count,Sum
      - name: Real startup smoke test
        shell: pwsh
        working-directory: source
        run: |
          $out = Resolve-Path dist/NIKKE_Mod_Manager_v0_34_9_Windows
          $exe = Join-Path $out 'NIKKE_Mod_Manager.exe'
          $err = Join-Path $out 'data/startup_error.log'
          Remove-Item $err -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 10
          if (Test-Path $err) {
            Write-Host 'STARTUP_ERROR_LOG:'
            Get-Content $err
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Runtime smoke test failed: startup_error.log was created'
          }
          $p.Refresh()
          if ($p.HasExited) { throw "Runtime smoke test failed: application exited with code $($p.ExitCode)" }
          Write-Host "RUNTIME_SMOKE_OK PID=$($p.Id)"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { throw 'Could not terminate smoke-test process' }
      - uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_34_9_Windows_Cython_Protected_FIXED
          path: source/dist/NIKKE_Mod_Manager_v0_34_9_Windows
          retention-days: 1
          if-no-files-found: error
