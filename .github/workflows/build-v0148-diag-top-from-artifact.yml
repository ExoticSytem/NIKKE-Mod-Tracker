name: Build v0.14.8 RuntimeDiagnosticTop from Artifact

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v0148-diag-top-from-artifact.yml'
      - 'tools/patch_v0148_diag_top.py'
      - 'tools/trigger_v0148_diag_top.txt'

permissions:
  contents: read
  actions: read

jobs:
  build-v0148-diag-top:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_ARTIFACT_ID: '10039976410'
      OUT_NAME: NIKKE_Mod_Manager_v0_14_8_Classic_Integrated_Viewer_RUNTIME_DIAGNOSTIC_TOP_FULL
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Download v0.14.7 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ExoticSytem/NIKKE-Mod-Tracker/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o artifact.zip
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          appzip=$(find artifact -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$appzip"
          unzip -q "$appzip" -d extracted
          find extracted -maxdepth 5 -type f -path '*/web/app.js' -print

      - name: Apply top visible diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v0148_diag_top.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_14_8_Classic_Integrated_Viewer_RUNTIME_DIAGNOSTIC_TOP_FULL
          path: dist/NIKKE_Mod_Manager_v0_14_8_Classic_Integrated_Viewer_RUNTIME_DIAGNOSTIC_TOP_FULL.zip
          if-no-files-found: error
          retention-days: 90
