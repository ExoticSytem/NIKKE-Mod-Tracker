name: Build v0.15.1 VendorAttachmentFix from v0.15.0 Artifact

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-v0151-vendor-attachment-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_ARTIFACT_ID: '10040467989'
      OUT_NAME: NIKKE_Mod_Manager_v0_15_1_Classic_Integrated_Viewer_VENDOR_ATTACHMENT_FIX_FULL
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Download v0.15.0 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ExoticSytem/NIKKE-Mod-Tracker/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o artifact.zip
          mkdir -p artifact extracted
          unzip -q artifact.zip -d artifact
          appzip=$(find artifact -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$appzip"
          unzip -q "$appzip" -d extracted

      - name: Apply vendor attachment fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v0151_vendor_attachment_fix.py

      - name: Zip artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('extracted')
          dirs = [p for p in root.iterdir() if p.is_dir()]
          if len(dirs) != 1:
              raise SystemExit('esperaba 1 carpeta de app, encontré: ' + ', '.join(str(p) for p in dirs))
          app = dirs[0]
          out = Path('dist') / 'NIKKE_Mod_Manager_v0_15_1_Classic_Integrated_Viewer_VENDOR_ATTACHMENT_FIX_FULL.zip'
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in app.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(app.parent))
          with zipfile.ZipFile(out) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('zip corrupto: ' + bad)
          print(out, out.stat().st_size)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIKKE_Mod_Manager_v0_15_1_Classic_Integrated_Viewer_VENDOR_ATTACHMENT_FIX_FULL
          path: dist/NIKKE_Mod_Manager_v0_15_1_Classic_Integrated_Viewer_VENDOR_ATTACHMENT_FIX_FULL.zip
          if-no-files-found: error
          retention-days: 90
